function createChantier(){
  const nom = document.getElementById('f-nom').value.trim();
  if(!nom){ toast('Le nom est obligatoire'); return; }
  const c = { id:uid('c'), nom, adresse:document.getElementById('f-adresse').value||'-', statut:document.getElementById('f-statut').value,
    budget:toEUR(document.getElementById('f-budget').value), depense:0, avancement:0,
    dateDebut:document.getElementById('f-debut').value, dateFin:document.getElementById('f-fin').value,
    intervenants:[currentUser.id], client:document.getElementById('f-client').value||'u6',
    lat:Number(document.getElementById('f-lat').value)||Math.random()*80+5, lng:Number(document.getElementById('f-lng').value)||Math.random()*80+5 };
  DB.chantiers.push(c); saveDB(); closeModal(); toast('Chantier créé'); navigate('chantiers', c.id);
}
function saveChantier(id){
  const c = chantierById(id);
  if(!c) return;
  const nom = document.getElementById('f-nom').value.trim();
  if(!nom){ toast('Le nom est obligatoire'); return; }
  // Le nom et les coordonnées ne sont jamais dupliqués ailleurs : toutes les vues le résolvent via chantierById(id).nom,
  // donc la modification se répercute automatiquement partout (dashboard, lots, factures, BC, documents, planning...).
  c.nom = nom;
  c.adresse = document.getElementById('f-adresse').value || '-';
  c.lat = Number(document.getElementById('f-lat').value) || c.lat;
  c.lng = Number(document.getElementById('f-lng').value) || c.lng;
  c.client = document.getElementById('f-client').value || c.client;
  c.statut = document.getElementById('f-statut').value;
  c.budget = toEUR(document.getElementById('f-budget').value);
  c.dateDebut = document.getElementById('f-debut').value;
  c.dateFin = document.getElementById('f-fin').value;
  saveDB(); closeModal(); toast('Chantier mis à jour'); renderView();
}
function deleteChantier(id){
  if(!confirm('Supprimer définitivement ce chantier et toutes ses données liées (lots, réserves, documents, factures...) ? Cette action est irréversible.')) return;
  DB.chantiers = DB.chantiers.filter(c=>c.id!==id);
  DB.lots = DB.lots.filter(x=>x.chantierId!==id);
  DB.reserves = DB.reserves.filter(x=>x.chantierId!==id);
  DB.documents = DB.documents.filter(x=>x.chantierId!==id);
  DB.planning = DB.planning.filter(x=>x.chantierId!==id);
  DB.rapports = DB.rapports.filter(x=>x.chantierId!==id);
  DB.rfis = DB.rfis.filter(x=>x.chantierId!==id);
  DB.submittals = DB.submittals.filter(x=>x.chantierId!==id);
  DB.journal = DB.journal.filter(x=>x.chantierId!==id);
  DB.avenants = DB.avenants.filter(x=>x.chantierId!==id);
  DB.factures = DB.factures.filter(x=>x.chantierId!==id);
  DB.situations = DB.situations.filter(x=>x.chantierId!==id);
  DB.depenses = DB.depenses.filter(x=>x.chantierId!==id);
  DB.bonsCommande = DB.bonsCommande.filter(x=>x.chantierId!==id);
  DB.objectifs = DB.objectifs.filter(x=>x.chantierId!==id);
  DB.messages = DB.messages.filter(x=>x.chantierId!==id);
  saveDB(); toast('Chantier supprimé'); navigate('chantiers');
}

/* ---- Validation multi-acteurs de l'avancement (BCT / MOE / autres) ---- */
function openLotValidationModal(lotId){
  const l = lotById(lotId);
  const c = chantierById(l.chantierId);
  const st = lotValidationStatus(l);
  const canConfigure = can('lot.edit', l.chantierId);
  // L'utilisateur courant peut-il soumettre une évaluation pour ce lot ?
  const myEffRole = effectiveRole(currentUser.id, l.chantierId);
  const myKey = (l.validateursRequis||[]).includes(myEffRole) ? myEffRole
    : ((l.validateursExtra||[]).some(e=>e.userId===currentUser.id) ? currentUser.id : null);
  const alreadySubmitted = myKey ? (l.validations||[]).find(v=>v.valKey===myKey) : null;
  const otherUsers = DB.users.filter(u=>!(l.validateursExtra||[]).some(e=>e.userId===u.id));
  openModal(`
    <h2>Validation de l'avancement — ${esc(l.nom)}</h2>
    <p class="sub">${esc(c.nom)} · avancement déclaré (non officiel) : ${l.avancement}%</p>
    <table style="margin-top:8px">
      <tr><th>Validateur requis</th><th>Évaluation</th><th>Date</th></tr>
      ${st.required.map(k=>{
        const v = st.submitted.find(x=>x.valKey===k);
        return `<tr><td>${esc(valKeyLabel(l,k))}</td><td>${v? v.pourcentage+'%' : '<span class="badge badge-orange">⏳ en attente</span>'}</td><td class="muted" style="font-size:12px">${v?fmtDate(v.date):'-'}</td></tr>`;
      }).join('') || `<tr><td colspan="3"><div class="empty-state" style="padding:14px">Aucun validateur requis défini</div></td></tr>`}
    </table>
    <div class="card" style="box-shadow:none;background:var(--bg);margin-top:14px">
      ${st.complete
        ? `<b>✓ Avancement officiellement retenu : ${st.avgPartial}%</b> (moyenne de ${st.submitted.length} évaluation(s))`
        : `<b>⏳ En attente de validation complète</b>${st.avgPartial!==null?` — moyenne partielle actuelle : ${st.avgPartial}% (non officielle)`:''}`}
    </div>
    ${myKey && !alreadySubmitted ? `
      <div class="form-row" style="margin-top:14px"><label>Votre évaluation du pourcentage d'avancement</label><input id="lv-pct" type="number" min="0" max="100" value="${l.avancement}"></div>
      <div class="form-row"><label>Commentaire (optionnel)</label><textarea id="lv-comment" placeholder="Observations, réserves..."></textarea></div>
      <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="submitLotValidation('${lotId}','${myKey}')">Soumettre mon évaluation</button></div>
    ` : (myKey && alreadySubmitted ? `
      <p class="muted" style="margin-top:12px;font-size:12.5px">Vous avez déjà soumis votre évaluation (${alreadySubmitted.pourcentage}%) le ${fmtDate(alreadySubmitted.date)}.</p>
      <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Fermer</button><button class="btn btn-ghost" onclick="retractLotValidation('${lotId}','${myKey}')">↩️ Retirer mon évaluation</button></div>
    ` : `<div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Fermer</button></div>`)}
    ${canConfigure ? `
      <div class="section-title" style="margin-top:18px"><h2 style="font-size:14px">Configurer les validateurs (Administration du lot)</h2></div>
      <p class="muted" style="font-size:12px">Validateurs requis actuels : ${(l.validateursRequis||[]).map(k=>ROLES[k]?ROLES[k].label:k).join(', ')||'aucun'}${(l.validateursExtra||[]).length?', '+l.validateursExtra.map(e=>e.label).join(', '):''}.</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="lv-extra-user" style="max-width:220px">${otherUsers.map(u=>`<option value="${u.id}">${esc(u.nom)}</option>`).join('')}</select>
        <input id="lv-extra-label" placeholder="Libellé (ex : Assureur, Client...)" style="max-width:200px">
        <button class="btn btn-secondary btn-sm" onclick="addExtraValidator('${lotId}')">+ Ajouter comme validateur</button>
      </div>
    ` : ''}
  `);
}
function submitLotValidation(lotId, valKey){
  const l = lotById(lotId);
  const pct = Math.min(100,Math.max(0,Number(document.getElementById('lv-pct').value)||0));
  const label = ROLES[valKey] ? ROLES[valKey].label+' — '+currentUser.nom : currentUser.nom;
  if(!l.validations) l.validations = [];
  l.validations = l.validations.filter(v=>v.valKey!==valKey);
  l.validations.push({ valKey, label, pourcentage:pct, date:todayISO(), commentaire:document.getElementById('lv-comment').value||'' });
  saveDB(); toast('Évaluation soumise — réversible via « Retirer mon évaluation »'); closeModal(); renderView();
}
// Une évaluation d'avancement soumise par erreur n'est pas définitive : chacun peut retirer la sienne.
function retractLotValidation(lotId, valKey){
  const l = lotById(lotId); if(!l) return;
  l.validations = (l.validations||[]).filter(v=>v.valKey!==valKey);
  saveDB(); toast('Évaluation retirée'); closeModal(); renderView();
}
function addExtraValidator(lotId){
  const l = lotById(lotId);
  const userId = document.getElementById('lv-extra-user').value;
  const label = document.getElementById('lv-extra-label').value.trim() || ('Validateur — '+userById(userId).nom);
  if(!l.validateursExtra) l.validateursExtra = [];
  if(!l.validateursExtra.some(e=>e.userId===userId)) l.validateursExtra.push({ userId, label });
  saveDB(); toast('Validateur ajouté'); openLotValidationModal(lotId);
}

/* ---- Gantt ---- */
function ganttHtml(tasks){
  if(!tasks.length) return `<div class="empty-state"><div class="ico">📅</div>Aucune tâche planifiée</div>`;
  const min = new Date(Math.min(...tasks.map(t=>new Date(t.debut))));
  const max = new Date(Math.max(...tasks.map(t=>new Date(t.fin))));
  const total = Math.max(daysBetween(min,max),1);
  return `<div class="card">${tasks.map(t=>{
    const offset = daysBetween(min,t.debut)/total*100;
    const width = Math.max(daysBetween(t.debut,t.fin)/total*100, t.jalon?0:2);
    const cls = t.retard? 'late' : (t.avancement>=100?'done':'');
    return `<div class="gantt-row">
      <div class="label">${esc(t.nom)}<small>${fmtDate(t.debut)} → ${fmtDate(t.fin)}</small></div>
      <div class="gantt-track">
        ${t.jalon
          ? `<div class="gantt-milestone" style="left:${offset}%"></div>`
          : `<div class="gantt-bar ${cls}" style="left:${offset}%;width:${width}%"><span>${t.avancement}%</span></div>`}
      </div>
    </div>`;
  }).join('')}</div>
  ${tasks.some(t=>t.retard)?`<div class="badge badge-red" style="margin-top:10px">⚠️ Retard détecté sur au moins une tâche</div>`:''}`;
}

// Ajoute un document à l'archive ZIP : le fichier réel joint (décodé depuis son data URL base64) s'il existe,
// sinon une fiche descriptive de démonstration (pour les documents créés avant l'ajout de l'upload réel).
function addDocToZip(zip, basePath, d, c){
  const safeDossier = (d.dossier||'Autres').replace(/[\\/:*?"<>|]/g,'-');
  const v = docLatestVersion(d);
  if(v.fileData){
    const safeNom = v.fichier.replace(/[\\/:*?"<>|]/g,'-');
    const base64 = v.fileData.split(',')[1] || '';
    zip.file(`${basePath}${safeDossier}/${safeNom}`, base64, {base64:true});
  } else {
    const safeNom = d.nom.replace(/[\\/:*?"<>|]/g,'-');
    const fiche = `Document : ${d.code} — ${d.nom}\nChantier : ${c.nom}\nDossier : ${d.dossier}${d.lotId?'\nLot : '+lotLabel(d.lotId):''}\nRévision : v${d.version} (${d.versions.length} version(s) dans l'historique)\nStatut : ${STATUT_DOC[d.statut]?STATUT_DOC[d.statut].label:d.statut}\nAuteur : ${userById(d.uploader)?.nom||'—'}\nDate : ${fmtDate(d.date)}\n\n(Fiche de démonstration — aucun fichier n'a été joint à ce document.)`;
    zip.file(`${basePath}${safeDossier}/${safeNom}.txt`, fiche);
  }
}
async function downloadChantierDocuments(chantierId){
  if(typeof JSZip === 'undefined'){ toast('Bibliothèque de compression indisponible (hors-ligne ?)'); return; }
  const c = chantierById(chantierId);
  const docs = DB.documents.filter(d=>d.chantierId===chantierId);
  if(!docs.length){ toast('Aucun document à exporter'); return; }
  const zip = new JSZip();
  const safeChantier = c.nom.replace(/[\\/:*?"<>|]/g,'-');
  docs.forEach(d=>{ addDocToZip(zip, '', d, c); });
  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'Documents_'+safeChantier+'_'+todayISO()+'.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast(docs.length+' document(s) exporté(s)');
}

function renderWorkflowStepper(d, version){

  const lastStep = lastSnap ? version.workflow.etapes.find(e=>e.ordre===lastSnap.stepOrdre) : null;
  return `
    <div class="section-title" style="margin:14px 0 10px"><h2 style="font-size:14px">Circuit de validation (v${version.numero})</h2></div>

        const cls = e.statut==='valide'?'badge-green':e.statut==='rejete'?'badge-red':e.statut==='en_attente'?'badge-orange':'badge-gray';

      }).join('')}

      <b style="font-size:13px">Étape en cours : ${esc(step.label)}</b>
      <div class="muted" style="font-size:12px;margin-top:4px">Délai accordé : ${step.delaiJours} j · échéance ${fmtDate(step.dateLimite)}
        ${sla&&sla.enRetard?` · <span style="color:var(--danger);font-weight:700">en retard</span>`:''}
        ${sla&&sla.palier?` · relance J+${sla.palier}`:''}
      </div>
      ${canDecide?`<div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-sm btn-secondary" onclick="decideDocStepUI('${d.id}',${version.numero},'valide')">✓ Valider cette étape</button>

// Génère et télécharge une archive .zip regroupant tous les documents visibles par l'utilisateur,
// classés automatiquement par Chantier / Dossier. Cette démo ne stockant pas de fichiers binaires réels,
// chaque document est représenté par une fiche descriptive (code, nom, révision, statut, auteur, date).
async function downloadAllDocuments(){
  if(typeof JSZip === 'undefined'){ toast('Bibliothèque de compression indisponible (hors-ligne ?)'); return; }
  const chantiers = visibleChantiers();
  const zip = new JSZip();
  let count = 0;
  chantiers.forEach(c=>{
    const safeChantier = c.nom.replace(/[\\/:*?"<>|]/g,'-');
    const docs = DB.documents.filter(d=>d.chantierId===c.id);
    docs.forEach(d=>{
      addDocToZip(zip, `${safeChantier}/`, d, c);
      count++;
    });
  });
  if(!count){ toast('Aucun document à exporter'); return; }
  toast('Génération de l\'archive en cours...');
  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'PILOT360_Documents_'+todayISO()+'.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast(count+' document(s) exporté(s), classés par chantier');
}

/* ================= COMPTABILITÉ (type Odoo) ================= */
function comptaChantiers(){ return visibleChantiers(); }
function comptaScope(list){
  const ids = comptaChantiers().map(c=>c.id);
  let items = list.filter(x=>ids.includes(x.chantierId));
  if(ui.comptaFilter && ui.comptaFilter!=='all') items = items.filter(x=>x.chantierId===ui.comptaFilter);
  return items;
}
function comptaFilterBar(){
  const chantiers = comptaChantiers();
  return `<div class="filter-bar"><select onchange="ui.comptaFilter=this.value;renderView()">
    <option value="all" ${ui.comptaFilter==='all'?'selected':''}>Tous les chantiers</option>
    ${chantiers.map(c=>`<option value="${c.id}" ${ui.comptaFilter===c.id?'selected':''}>${esc(c.nom)}</option>`).join('')}
  </select></div>`;
}
function comptaKPIs(chantiers){
  const facturesClient = DB.factures.filter(f=>f.type==='client' && chantiers.some(c=>c.id===f.chantierId));
  const facturesFourn = DB.factures.filter(f=>f.type==='fournisseur' && chantiers.some(c=>c.id===f.chantierId));
  const ca = facturesClient.reduce((s,f)=>s+f.montantHT,0);
  const encaisse = facturesClient.filter(f=>f.statut==='payee').reduce((s,f)=>s+f.montantHT,0);
  const impaye = facturesClient.filter(f=>f.statut!=='payee').reduce((s,f)=>s+f.montantHT,0);
  const achats = facturesFourn.reduce((s,f)=>s+f.montantHT,0);
  const achatsPayes = facturesFourn.filter(f=>f.statut==='payee').reduce((s,f)=>s+f.montantHT,0);
  const achatsDus = facturesFourn.filter(f=>f.statut!=='payee').reduce((s,f)=>s+f.montantHT,0);
  const depensesReelles = chantiers.reduce((s,c)=>s+lotAggregates(c.id).depense,0);
  const marge = ca - depensesReelles;
  return { ca, encaisse, impaye, achats, achatsPayes, achatsDus, marge };
}
function viewCompta(){
  const chantiers = comptaChantiers();
  const tabs = [['overview','Vue globale'],['clients','Factures clients'],['fournisseurs','Factures fournisseurs'],['situations','Situations de travaux'],['decompte','Décompte client']];
  let body = '';
  if(ui.comptaTab==='overview') body = comptaOverviewTab(chantiers);
  else if(ui.comptaTab==='clients') body = comptaFacturesTab('client');
  else if(ui.comptaTab==='fournisseurs') body = comptaFacturesTab('fournisseur');
  else if(ui.comptaTab==='situations') body = comptaSituationsTab(chantiers);
  else if(ui.comptaTab==='decompte') body = comptaDecompteTab(chantiers);
  return `
    <div class="page-head">
      <div><h1>Comptabilité</h1><p>Facturation client/fournisseur, situations de travaux et marge — type module comptable intégré (Odoo)</p></div>

    </div>
    ${comptaFilterBar()}

    <div id="compta-body">${body}</div>

          <tr><th>Situation</th><th>Date</th><th>Montant de la période</th><th>Cumul facturé</th></tr>
          ${sits.map(s=>`<tr><td>N°${s.numero}</td><td>${fmtDate(s.dateEmission)}</td><td>${fmtMoney(s.montantPeriode)}</td><td>${fmtMoney(s.montantCumule)}</td></tr>`).join('') || `<tr><td colspan="4"><div class="empty-state">Aucune situation émise</div></td></tr>`}
        </table>
      </div>
    `;
  }).join('');
}
function genererSituation(chantierId){
  const agg = lotAggregates(chantierId);
  const cumulTheorique = Math.round(agg.budget * agg.avancement/100);
  const sits = DB.situations.filter(s=>s.chantierId===chantierId).sort((a,b)=>a.numero-b.numero);
  const dernierCumul = sits.length ? sits[sits.length-1].montantCumule : 0;
  const periode = cumulTheorique - dernierCumul;
  if(periode<=0){ toast('Aucun montant supplémentaire à facturer (avancement inchangé)'); return; }
  const numero = (sits.length ? sits[sits.length-1].numero : 0) + 1;
  DB.situations.push({ id:uid('sit'), chantierId, numero, dateEmission:todayISO(), montantCumule:cumulTheorique, montantPeriode:periode });
  DB.factures.push({ id:uid('f'), type:'client', chantierId, lotId:null, numero:'FC-SIT-'+chantierId+'-'+numero,
    tiers:userById(chantierById(chantierId).client).nom, montantHT:periode, tauxTVA:20, statut:'brouillon',
    dateEmission:todayISO(), dateEcheance:todayISO(), description:'Situation de travaux n°'+numero+' — '+chantierById(chantierId).nom });
  saveDB(); toast('Situation n°'+numero+' générée ('+fmtMoney(periode)+')'); renderView();
}

function createDepense(chantierId){
  const libelle = document.getElementById('dpf-libelle').value.trim();
  if(!libelle){ toast('Le libellé est obligatoire'); return; }
  const lotId = document.getElementById('dpf-lot').value;
  const montant = toEUR(document.getElementById('dpf-montant').value);
  DB.depenses.push({ id:uid('dp'), chantierId, lotId, date:document.getElementById('dpf-date').value||todayISO(),
    libelle, categorie:document.getElementById('dpf-categorie').value, montant, justificatif:document.getElementById('dpf-justif').checked, auteur:currentUser.id });
  const l = lotById(lotId); if(l) l.depense += montant;
  saveDB(); closeModal(); toast('Dépense enregistrée'); renderView();
}
function deleteDepense(id){
  if(!confirm('Supprimer cette dépense ? Le budget consommé du lot sera recalculé.')) return;
  const d = DB.depenses.find(x=>x.id===id);
  if(d){ const l = lotById(d.lotId); if(l) l.depense -= d.montant; }
  DB.depenses = DB.depenses.filter(x=>x.id!==id); saveDB(); toast('Dépense supprimée'); renderView();
}
function saveDepense(id){
  const d = DB.depenses.find(x=>x.id===id);
  if(!d) return;
  const libelle = document.getElementById('dpf-libelle').value.trim();
  if(!libelle){ toast('Le libellé est obligatoire'); return; }
  const newLotId = document.getElementById('dpf-lot').value;
  const newMontant = toEUR(document.getElementById('dpf-montant').value);
  // On répercute le delta sur le(s) lot(s) concerné(s) pour garder la dépense du lot synchronisée
  const oldLot = lotById(d.lotId); if(oldLot) oldLot.depense -= d.montant;
  const newLot = lotById(newLotId); if(newLot) newLot.depense += newMontant;
  d.lotId = newLotId; d.montant = newMontant; d.libelle = libelle;
  d.categorie = document.getElementById('dpf-categorie').value; d.date = document.getElementById('dpf-date').value||d.date;
  d.justificatif = document.getElementById('dpf-justif').checked;
  saveDB(); closeModal(); toast('Dépense mise à jour'); renderView();
}

function canSeeBC(bc){
  if(currentUser.role==='admin') return true;
  if(currentUser.id===bc.emetteurId || currentUser.id===bc.destinataireId) return true;

function createBC(){
  const fournisseur = document.getElementById('bcf-fournisseur').value.trim();
  if(!fournisseur){ toast('Le nom du fournisseur est obligatoire'); return; }
  const chantierId = document.getElementById('bcf-chantier').value;
  const lotId = document.getElementById('bcf-lot').value || null;
  const destinataireId = document.getElementById('bcf-destinataire').value;
  const check = objectifsAtteints(destinataireId, chantierId, lotId);
  let derogation = false, derogationMotif = '';
  if(!check.ok){
    if(!canDeroger()){
      toast('⛔ Émission bloquée : objectif(s) non atteint(s) pour '+userById(destinataireId).nom+' — '+check.objectifs.filter(o=>o.statut!=='atteint').map(o=>o.titre).join(', '));
      return;
    }
    derogationMotif = prompt('Objectif(s) non atteint(s). Vous disposez du droit de dérogation : merci de préciser le motif :') || '';
    if(!derogationMotif){ toast('Émission annulée (motif de dérogation requis)'); return; }
    derogation = true;
  }
  const n = DB.bonsCommande.length+1;
  DB.bonsCommande.push({ id:uid('bc'), numero:'BC-'+new Date().getFullYear()+'-'+String(100+n), chantierId, lotId, fournisseur, destinataireId,
    emetteurId:currentUser.id, dateEmission:todayISO(), dateLivraisonPrevue:document.getElementById('bcf-livraison').value||todayISO(),
    statut:'emis', lignes:window.__bcLignes.filter(l=>l.designation), conditions:document.getElementById('bcf-conditions').value||'-',
    tauxTVA:Number(document.getElementById('bcf-tva').value)||20, derogation, derogationPar:derogation?currentUser.id:null, derogationMotif, visibleTo:[] });
  saveDB(); closeModal(); toast(derogation?'Bon de commande créé par dérogation':'Bon de commande créé'); renderView();
}

function viewIA(){
  return `

    <div class="ai-panel">
      <h3>🤖 Assistant PILOT360°</h3>
      <p>Posez une question sur vos chantiers, ou choisissez une suggestion.</p>
      <div class="ai-input-row">
        <input id="ai-input" placeholder="Ex : Résume la situation du chantier Confluence" onkeydown="if(event.key==='Enter') askAI()">
        <button class="btn btn-orange" onclick="askAI()">Demander</button>
      </div>
      <div class="ai-suggestions">
        <span class="ai-chip" onclick="askAI('résumé global')">📊 Résumé global des chantiers</span>
        <span class="ai-chip" onclick="askAI('risques budget')">💶 Risques budgétaires</span>
        <span class="ai-chip" onclick="askAI('brouillon compte-rendu')">📝 Brouillon de compte-rendu</span>
        <span class="ai-chip" onclick="askAI('retards')">⏱️ Chantiers en retard</span>
        <span class="ai-chip" onclick="askAI('situation financière')">📈 Situation financière</span>
      </div>
      <div id="ai-answer"></div>
    </div>
    <div class="grid cols-2">
      <div class="card"><h3>💡 Pourquoi un assistant IA ?</h3><p class="muted" style="margin-top:8px;line-height:1.6">Contrairement aux outils classiques de suivi de chantier, PILOT360° analyse en continu vos données (budget, avancement, réserves) pour générer alertes et brouillons de rapports, afin de faire gagner du temps aux conducteurs de travaux.</p></div>
      <div class="card"><h3>🔒 Confidentialité</h3><p class="muted" style="margin-top:8px;line-height:1.6">Dans cette démo, l'analyse est réalisée localement à partir des données du navigateur — aucune donnée n'est envoyée à un service externe.</p></div>
    </div>
  `;
}
function askAI(preset){
  const input = document.getElementById('ai-input');
  const question = preset || input.value.trim();
  if(!question) return;
  if(input) input.value = question===preset ? '' : input.value;
  const answer = generateAIAnswer(question.toLowerCase());
  document.getElementById('ai-answer').innerHTML = `<div class="ai-answer">${esc(answer)}</div>`;
}
function generateAIAnswer(q){
  const chantiers = visibleChantiers();
  if(q.includes('retard')){
    const late = chantiers.filter(c=>c.statut==='en_retard');
    if(!late.length) return 'Aucun chantier en retard identifié actuellement. 👍';
    return late.map(c=>{
      const a = lotAggregates(c.id);
      const t = DB.planning.filter(p=>p.chantierId===c.id && p.retard);
      return `⚠️ ${c.nom} : retard identifié${t.length? ' sur "'+t[0].nom+'"':''}. Avancement global ${a.avancement}%, budget consommé ${Math.round(a.depense/a.budget*100)}%.`;
    }).join('\n');
  }
  if(q.includes('budget') || q.includes('risque')){
    return chantiers.map(c=>{
      const a = lotAggregates(c.id);
      const pctBudget = Math.round(a.depense/a.budget*100);
      const risk = pctBudget > a.avancement + 15 ? "🔴 Risque de dépassement (dépense supérieure à l'avancement physique)" : '🟢 Budget maîtrisé';
      return `${c.nom} : ${pctBudget}% du budget consommé pour ${a.avancement}% d'avancement. ${risk}`;
    }).join('\n');
  }
  if(q.includes('finance') || q.includes('facturation') || q.includes('marge')){
    const k = comptaKPIs(chantiers);
    return `Situation financière : ${fmtMoney(k.ca)} facturés, dont ${fmtMoney(k.encaisse)} encaissés et ${fmtMoney(k.impaye)} en attente de paiement.\nMarge brute estimée (CA facturé − dépenses réelles) : ${fmtMoney(k.marge)}.\n\nRecommandation : relancer les factures impayées et générer les situations de travaux en retard depuis le module Comptabilité.`;
  }
  if(q.includes('brouillon') || q.includes('compte-rendu') || q.includes('cr')){
    const c = chantiers[0];
    if(!c) return 'Aucun chantier disponible.';
    const a = lotAggregates(c.id);
    const openR = DB.reserves.filter(r=>r.chantierId===c.id && r.statut!=='levee');
    const openRfi = DB.rfis.filter(r=>r.chantierId===c.id && r.statut==='ouverte');
    return `Brouillon — Compte-rendu ${c.nom} (${fmtDate(todayISO())})\n\nAvancement global : ${a.avancement}%.\nBudget consommé : ${fmtMoney(a.depense)} sur ${fmtMoney(a.budget)} (${Math.round(a.depense/a.budget*100)}%).\nRéserves en cours : ${openR.length} (${openR.map(r=>r.titre).join(', ')||'aucune'}).\nRFI ouvertes : ${openRfi.length}.\n\nÀ valider et compléter par le conducteur de travaux avant diffusion.`;
  }
  // résumé global / défaut
  const aggs = chantiers.map(c=>lotAggregates(c.id));
  const totalBudget = aggs.reduce((s,a)=>s+a.budget,0);
  const totalDep = aggs.reduce((s,a)=>s+a.depense,0);
  const avg = aggs.length ? Math.round(aggs.reduce((s,a)=>s+a.avancement,0)/aggs.length) : 0;
  const openReserves = chantiers.flatMap(c=>DB.reserves.filter(r=>r.chantierId===c.id && r.statut!=='levee'));
  return `Vous suivez ${chantiers.length} chantier(s) pour un budget total de ${fmtMoney(totalBudget)}, dont ${fmtMoney(totalDep)} déjà engagés (${Math.round(totalDep/totalBudget*100)||0}%).\nAvancement moyen : ${avg}%.\n${openReserves.length} réserve(s) restent à traiter, dont ${openReserves.filter(r=>r.priorite==='haute').length} de priorité haute.\n\nRecommandation : prioriser le traitement des réserves à haute priorité avant les prochaines réceptions de travaux.`;
}

  else DB.permissionOverrides[userId][action] = (value==='allow');

function openUserForm(id){
  const u = id ? userById(id) : null;
  openModal(`
    <h2>${u?'Modifier l\'utilisateur':'Nouvel utilisateur'}</h2>
    <div class="form-row"><label>Nom complet</label><input id="uf-nom" placeholder="Prénom Nom" value="${u?esc(u.nom):''}"></div>

    <div class="form-row"><label>Rôle</label><select id="uf-role">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${u&&u.role===k?'selected':''}>${r.label}</option>`).join('')}</select></div>
    ${!u?`<div class="form-row"><label>Mot de passe initial</label><input id="uf-password" type="password" placeholder="8 caractères minimum"></div>`:''}

  `);
}
function createUser(){
  const nom = document.getElementById('uf-nom').value.trim();
  const username = document.getElementById('uf-username').value.trim();
  const email = document.getElementById('uf-email').value.trim();
  const password = document.getElementById('uf-password').value;
  if(!nom){ toast('Le nom est obligatoire'); return; }
  if(!username){ toast('L\'identifiant de connexion est obligatoire'); return; }
  if(username.includes('@')){ toast('L\'identifiant ne doit pas contenir "@" (ce n\'est pas une adresse e-mail)'); return; }
  if(DB.users.some(u=>(u.username||'').toLowerCase()===username.toLowerCase())){ toast('Un utilisateur existe déjà avec cet identifiant'); return; }
  if(!password || password.length<8){ toast('Le mot de passe doit contenir au moins 8 caractères'); return; }
  const id = uid('u');
  DB.users.push({ id, nom, username, email, role:document.getElementById('uf-role').value, passwordHash:hashPassword(password,id) });
  saveDB(); closeModal(); toast('Utilisateur créé'); renderView();
}
function saveUser(id){
  const u = userById(id);
  if(!u) return;
  const nom = document.getElementById('uf-nom').value.trim();
  const username = document.getElementById('uf-username').value.trim();
  const email = document.getElementById('uf-email').value.trim();
  if(!nom){ toast('Le nom est obligatoire'); return; }
  if(!username){ toast('L\'identifiant de connexion est obligatoire'); return; }
  if(username.includes('@')){ toast('L\'identifiant ne doit pas contenir "@" (ce n\'est pas une adresse e-mail)'); return; }
  if(DB.users.some(x=>x.id!==id && (x.username||'').toLowerCase()===username.toLowerCase())){ toast('Un autre utilisateur possède déjà cet identifiant'); return; }
  // nom/identifiant/email résolus partout via userById(id) : la modification se répercute automatiquement dans toute l'application
  u.nom = nom; u.username = username; u.email = email; u.role = document.getElementById('uf-role').value;
  saveDB(); closeModal(); toast('Utilisateur mis à jour'); renderView();
}
function openPasswordForm(id){
  const u = userById(id);
  if(!u) return;
  openModal(`
    <h2>Changer le mot de passe</h2>
    <p class="sub">${esc(u.nom)} — identifiant : ${esc(u.username||'')}</p>
    <div class="form-row"><label>Nouveau mot de passe</label><input id="pf-password" type="password" placeholder="8 caractères minimum"></div>
    <div class="form-row"><label>Confirmer le mot de passe</label><input id="pf-password2" type="password" placeholder="Ressaisir le mot de passe"></div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="setUserPassword('${u.id}')">Enregistrer</button></div>
  `);
}
function setUserPassword(id){
  const u = userById(id);
  if(!u) return;
  const p1 = document.getElementById('pf-password').value;
  const p2 = document.getElementById('pf-password2').value;
  if(!p1 || p1.length<8){ toast('Le mot de passe doit contenir au moins 8 caractères'); return; }
  if(p1!==p2){ toast('Les deux mots de passe ne correspondent pas'); return; }
  u.passwordHash = hashPassword(p1, u.id);
  saveDB(); closeModal(); toast('Mot de passe mis à jour');
}
function changeUserRole(id, role){
  userById(id).role = role; saveDB(); toast('Rôle mis à jour'); renderView();
}
function deleteUser(id){
  if(id===currentUser.id){ toast("Impossible de supprimer l'utilisateur connecté"); return; }
  DB.users = DB.users.filter(u=>u.id!==id); saveDB(); renderView();
}
