<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PILOT360° — Plateforme de gestion de chantier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --sidebar-bg:#0f1729;
  --sidebar-hover:#1a2740;
  --sidebar-text:#c7d2e3;
  --sidebar-text-active:#ffffff;
  --accent:#2563eb;
  --accent-light:#dbeafe;
  --accent-orange:#f97316;
  --accent-orange-light:#ffedd5;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1e293b;
  --text-muted:#64748b;
  --border:#e6e9f0;
  --success:#16a34a;
  --success-light:#dcfce7;
  --warning:#f59e0b;
  --warning-light:#fef3c7;
  --danger:#dc2626;
  --danger-light:#fee2e2;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.04);
}
body.dark{
  --bg:#0b1220;
  --card:#131c2e;
  --text:#e5e9f2;
  --text-muted:#94a3b8;
  --border:#22304a;
  --accent-light:#16294f;
  --accent-orange-light:#3a2410;
  --success-light:#0f2a1c;
  --warning-light:#3a2b0a;
  --danger-light:#3a1414;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .2s,color .2s;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#c3cadb;border-radius:8px;}
body.dark ::-webkit-scrollbar-thumb{background:#2a3a58;}

/* ---------- Login ---------- */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f1729 0%,#16233d 45%,#1d2f52 100%);
  padding:24px;
}
.login-card{
  background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);
  width:100%;max-width:400px;overflow:hidden;
}
.login-form{padding:44px 38px;display:flex;flex-direction:column;}
.login-logo{font-size:22px;font-weight:800;text-align:center;margin-bottom:26px;letter-spacing:.3px;color:var(--text);}
.login-form h2{margin:0 0 4px;font-size:20px;text-align:center;}
.login-form p.sub{margin:0 0 24px;color:var(--text-muted);font-size:13.5px;text-align:center;}
.login-error{
  background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:#dc2626;
  border-radius:8px;padding:9px 12px;font-size:12.8px;margin-bottom:14px;
}
.btn{
  border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.15s;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#1d4ed8;}
.btn-secondary{background:var(--accent-light);color:var(--accent);}
.btn-secondary:hover{filter:brightness(0.97);}
.btn-orange{background:var(--accent-orange);color:#fff;}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
.btn-danger{background:var(--danger-light);color:var(--danger);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.lang-switch{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-shrink:0;}
.lang-btn{padding:7px 11px;border:none;background:transparent;color:var(--text-muted);font-size:12px;font-weight:700;letter-spacing:.3px;cursor:pointer;transition:.15s;}
.lang-btn:hover{color:var(--text);}
.lang-btn.active{background:var(--accent);color:#fff;}

/* ---------- App shell ---------- */
#app{display:none;min-height:100vh;grid-template-columns:236px 1fr;}
#app.show{display:grid;}
.sidebar{
  background:var(--sidebar-bg);color:var(--sidebar-text);padding:20px 14px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;overflow-y:auto;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
.sidebar .brand .logo{
  min-width:34px;height:34px;padding:0 7px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#60a5fa);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:11.5px;flex:none;letter-spacing:.2px;
}
.sidebar .brand b{color:#fff;font-size:16px;letter-spacing:.3px;}
.sidebar .brand small{display:block;color:#7d8cad;font-size:10.5px;}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#5c6b8c;margin:14px 10px 4px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font-size:13.6px;font-weight:500;color:var(--sidebar-text);
  cursor:pointer;position:relative;
}
.nav-item .ico{font-size:16px;width:20px;text-align:center;}
.nav-item:hover{background:var(--sidebar-hover);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-item .badge{
  margin-left:auto;background:var(--accent-orange);color:#fff;font-size:10.5px;font-weight:700;
  border-radius:20px;padding:1px 7px;
}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid #1e2c47;}
.main{min-width:0;}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);
  padding:12px 26px;display:flex;align-items:center;gap:16px;
}
.topbar .search{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;color:var(--text-muted);font-size:13.5px;position:relative;
}
.topbar .search input{border:none;background:transparent;outline:none;color:var(--text);font-size:13.5px;width:100%;}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;width:min(480px,90vw);max-height:420px;overflow-y:auto;
  background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(10,15,28,.18);
  z-index:30;display:none;padding:6px;
}
.search-results.show{display:block;}
.search-results .sr-group{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:8px 10px 4px;}
.search-results .sr-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text);
}
.search-results .sr-item:hover{background:var(--bg);}
.search-results .sr-item .sr-ico{font-size:15px;width:22px;text-align:center;flex-shrink:0;}
.search-results .sr-item .sr-txt{min-width:0;flex:1;}
.search-results .sr-item .sr-txt b{display:block;font-size:12.8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-results .sr-item .sr-txt span{display:block;font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-results .sr-empty{padding:18px 10px;text-align:center;color:var(--text-muted);font-size:12.5px;}
.topbar .spacer{flex:1;}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;color:var(--text);
}
.icon-btn:hover{background:var(--bg);}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--card);}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 6px;border-radius:30px;border:1px solid var(--border);cursor:pointer;}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
.user-chip .who b{display:block;font-size:12.5px;line-height:1.2;}
.user-chip .who span{font-size:10.5px;color:var(--text-muted);}
.content{padding:22px 26px 60px;max-width:1400px;}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-size:21px;margin:0 0 4px;}
.page-head p{margin:0;color:var(--text-muted);font-size:13.5px;}
.breadcrumb{font-size:12.5px;color:var(--text-muted);margin-bottom:6px;}
.breadcrumb a:hover{color:var(--accent);}

.grid{display:grid;gap:16px;}
.cols-4{grid-template-columns:repeat(4,1fr);}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.cols-4{grid-template-columns:repeat(2,1fr);}.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:720px){#app.show{grid-template-columns:1fr;}.sidebar{display:none;}.cols-4,.cols-3,.cols-2{grid-template-columns:1fr;}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.card h3{margin:0 0 4px;font-size:14.5px;}
.card .muted{color:var(--text-muted);font-size:12.5px;}

.kpi .top{display:flex;align-items:center;justify-content:space-between;}
.kpi .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.kpi .value{font-size:25px;font-weight:700;margin:10px 0 2px;}
.kpi .trend{font-size:12px;font-weight:600;}
.trend.up{color:var(--success);}
.trend.down{color:var(--danger);}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title h2{font-size:16px;margin:0;}

table{width:100%;border-collapse:collapse;font-size:13.2px;}
th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border);}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.clickable:hover{background:var(--bg);cursor:pointer;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.badge-blue{background:var(--accent-light);color:var(--accent);}
.badge-green{background:var(--success-light);color:var(--success);}
.badge-orange{background:var(--warning-light);color:var(--warning);}
.badge-red{background:var(--danger-light);color:var(--danger);}
.badge-gray{background:var(--bg);color:var(--text-muted);border:1px solid var(--border);}

.progress{height:7px;border-radius:20px;background:var(--bg);overflow:hidden;border:1px solid var(--border);}
.progress > div{height:100%;background:linear-gradient(90deg,var(--accent),#60a5fa);border-radius:20px;}
.progress.orange > div{background:linear-gradient(90deg,var(--accent-orange),#fbbf24);}

.chantier-card{cursor:pointer;transition:.15s;}
.chantier-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,23,42,.1);}
.chantier-card .photo{
  height:110px;border-radius:10px;margin:-18px -18px 12px;background:linear-gradient(120deg,#334155,#0f1729);
  display:flex;align-items:flex-end;padding:10px 14px;position:relative;overflow:hidden;
}
.chantier-card .photo:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 0%, rgba(37,99,235,.35), transparent 60%);}
.chantier-card .photo b{color:#fff;position:relative;z-index:1;font-size:13.5px;}
.chantier-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--text-muted);margin:10px 0;}
.chantier-meta span{display:flex;align-items:center;gap:4px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;cursor:pointer;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-color:var(--accent);}

.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--text-muted);}
.form-row input, .form-row select, .form-row textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13.5px;
  background:var(--bg);color:var(--text);font-family:inherit;
}
.form-row textarea{resize:vertical;min-height:80px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(10,15,28,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.35);}
.modal h2{margin:0 0 4px;font-size:18px;}
.modal .sub{color:var(--text-muted);font-size:13px;margin:0 0 18px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .2s ease;}
body.dark .toast{background:#1e293b;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.reserve-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;}
.reserve-thumb{width:52px;height:52px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;border:1px solid var(--border);}
.reserve-row .r-body{flex:1;min-width:0;}
.reserve-row .r-body .r-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.reserve-row .r-body p{margin:3px 0 6px;font-size:12.8px;color:var(--text-muted);}
.reserve-actions{display:flex;gap:6px;flex-wrap:wrap;}

.doc-tree{display:flex;flex-direction:column;gap:2px;}
.doc-folder{font-weight:700;font-size:13px;padding:9px 8px;display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:8px;}
.doc-folder:hover{background:var(--bg);}
.doc-file{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 30px;border-radius:8px;font-size:13px;}
.doc-file:hover{background:var(--bg);}
.doc-file .name{flex:1;}
.doc-file .meta{font-size:11.5px;color:var(--text-muted);}

.gantt-row{display:grid;grid-template-columns:220px 1fr;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--border);}
.gantt-row:last-child{border-bottom:none;}
.gantt-row .label{font-size:12.8px;font-weight:600;}
.gantt-row .label small{display:block;font-weight:400;color:var(--text-muted);font-size:11px;}
.gantt-track{position:relative;height:22px;background:var(--bg);border-radius:6px;}
.gantt-bar{position:absolute;top:2px;bottom:2px;border-radius:6px;background:linear-gradient(90deg,var(--accent),#60a5fa);display:flex;align-items:center;padding:0 8px;}
.gantt-bar.late{background:linear-gradient(90deg,var(--danger),#f87171);}
.gantt-bar.done{background:linear-gradient(90deg,var(--success),#4ade80);}
.gantt-bar span{color:#fff;font-size:10.5px;font-weight:700;white-space:nowrap;}
.gantt-milestone{position:absolute;top:-4px;width:14px;height:14px;background:var(--accent-orange);transform:rotate(45deg) translateX(-50%);border-radius:3px;border:2px solid var(--card);}

.chat-wrap{display:grid;grid-template-columns:260px 1fr;gap:0;border:1px solid var(--border);border-radius:14px;overflow:hidden;height:600px;background:var(--card);}
.chat-list{border-right:1px solid var(--border);overflow-y:auto;}
.chat-list-item{padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.chat-list-item:hover{background:var(--bg);}
.chat-list-item.active{background:var(--accent-light);}
.chat-list-item b{font-size:13px;display:block;}
.chat-list-item span{font-size:11.5px;color:var(--text-muted);}
.chat-main{display:flex;flex-direction:column;height:100%;}
.chat-messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
.chat-msg{max-width:70%;padding:10px 14px;border-radius:14px;font-size:13px;background:var(--bg);}
.chat-msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.chat-msg .meta{font-size:10.5px;opacity:.7;margin-top:4px;}
.chat-msg:not(.me){border-bottom-left-radius:4px;}
.chat-input{display:flex;gap:8px;padding:14px;border-top:1px solid var(--border);}
.chat-input input{flex:1;border:1px solid var(--border);border-radius:20px;padding:10px 16px;background:var(--bg);color:var(--text);outline:none;}

.ai-panel{background:linear-gradient(135deg,#0f1729,#1d3a6e);color:#fff;border-radius:16px;padding:20px;margin-bottom:20px;}
.ai-panel h3{margin:0 0 4px;display:flex;align-items:center;gap:8px;}
.ai-panel p{margin:0 0 14px;color:#b9c6e6;font-size:13px;}
.ai-input-row{display:flex;gap:8px;}
.ai-input-row input{flex:1;border:none;border-radius:10px;padding:11px 14px;font-size:13.5px;outline:none;}
.ai-suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.ai-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;}
.ai-chip:hover{background:rgba(255,255,255,.2);}
.ai-answer{background:rgba(255,255,255,.08);border-radius:10px;padding:14px;margin-top:12px;font-size:13px;line-height:1.55;white-space:pre-line;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-state .ico{font-size:36px;margin-bottom:10px;}

.timeline{display:flex;flex-direction:column;gap:0;}
.timeline-item{display:flex;gap:12px;padding:10px 0;position:relative;}
.timeline-item .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none;}
.timeline-item .line{position:absolute;left:4px;top:20px;bottom:-4px;width:1px;background:var(--border);}
.timeline-item .txt{font-size:12.8px;}
.timeline-item .txt b{font-weight:600;}
.timeline-item .time{font-size:11px;color:var(--text-muted);}

.map-card{background:linear-gradient(135deg,#e2e8f0,#cbd5e1);border-radius:14px;height:260px;position:relative;overflow:hidden;}
body.dark .map-card{background:linear-gradient(135deg,#1e293b,#0f1729);}
.map-pin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--accent-orange);transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.25);}
.map-pin span{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:800;}
.map-grid-line{position:absolute;background:rgba(148,163,184,.35);}

.offline-banner{background:var(--warning-light);color:#92400e;font-size:12.5px;padding:8px 26px;display:none;align-items:center;gap:8px;}
.offline-banner.show{display:flex;}

/* ---- Matrix / rights table ---- */
.matrix-table{border-collapse:collapse;}
.matrix-table th, .matrix-table td{border:1px solid var(--border);padding:8px 10px;font-size:12.3px;}
.matrix-table th{background:var(--bg);position:sticky;top:0;}
.matrix-table input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}

/* ---- Filter / pill bar ---- */
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.filter-bar select{width:auto;border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--card);color:var(--text);font-size:13px;}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.pill{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ---- KPI with sparkline ---- */
.kpi-spark{margin-top:6px;height:28px;}
.kpi-spark svg{width:100%;height:100%;}

/* ---- Data-bar (Power BI style inline bar in table cell) ---- */
.data-bar-wrap{position:relative;background:var(--bg);border-radius:5px;height:18px;min-width:90px;overflow:hidden;}
.data-bar-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),#60a5fa);border-radius:5px 0 0 5px;}

.data-bar-fill.red{background:linear-gradient(90deg,var(--danger),#f87171);}
.data-bar-label{position:relative;z-index:1;font-size:10.8px;font-weight:700;color:var(--text);padding:0 6px;line-height:18px;}

.bi-kpi .lbl{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.bi-kpi .val{font-size:24px;font-weight:800;margin:6px 0 2px;}

const fmtDate = (iso) => { if(!iso) return '-'; const d = new Date(iso); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); };
const addDaysISO = (iso, days) => { const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+(days||0)); return d.toISOString().slice(0,10); };
const daysBetweenISO = (isoStart, isoEnd) => { const a = new Date(isoStart+'T00:00:00'), b = new Date(isoEnd+'T00:00:00'); return Math.round((b-a)/86400000); };
const fmtFileSize = (bytes) => { if(!bytes) return '0 o'; if(bytes<1024) return bytes+' o'; if(bytes<1024*1024) return Math.round(bytes/1024*10)/10+' Ko'; return Math.round(bytes/1024/1024*10)/10+' Mo'; };

/* ---- Authentification : hachage de mot de passe (SHA-256 pur JS, synchrone, sans dépendance externe) ----
   Remarque : cette application étant 100% statique (aucun serveur), il ne s'agit pas d'un stockage
   « bancaire » de mots de passe, mais cela évite qu'ils apparaissent en clair dans les données locales. */
function sha256(ascii){
  function rightRotate(value, amount){ return (value>>>amount) | (value<<(32-amount)); }
  const mathPow = Math.pow;
  const maxWord = mathPow(2,32);
  let i, j;
  let result = '';
  let words = [];
  const asciiBitLength = ascii.length*8;
  let hash = sha256.h = sha256.h || [];
  let k = sha256.k = sha256.k || [];
  let primeCounter = k.length;
  const isComposite = {};
  for(let candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate){ isComposite[i]=candidate; }
      hash[primeCounter] = (mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++] = (mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while(ascii.length%64 - 56) ascii += '\x00';
  for(i=0;i<ascii.length;i++){
    j = ascii.charCodeAt(i);
    if(j>>8) return; // entrée déjà convertie en octets UTF-8 (0-255) par utf8ToBinaryString
    words[i>>2] |= j << ((3-i)%4)*8;
  }
  words[words.length] = ((asciiBitLength/maxWord)|0);
  words[words.length] = (asciiBitLength);
  for(j=0; j<words.length;){
    const w = words.slice(j, j+=16);
    const oldHash = hash;
    hash = hash.slice(0,8);
    for(i=0;i<64;i++){
      const w15 = w[i-15], w2 = w[i-2];
      const a = hash[0], e = hash[4];
      const temp1 = hash[7]
        + (rightRotate(e,6) ^ rightRotate(e,11) ^ rightRotate(e,25))
        + ((e&hash[5])^((~e)&hash[6]))
        + k[i]
        + (w[i] = (i<16) ? w[i] : (
            w[i-16]
            + (rightRotate(w15,7) ^ rightRotate(w15,18) ^ (w15>>>3))
            + w[i-7]
            + (rightRotate(w2,17) ^ rightRotate(w2,19) ^ (w2>>>10))
          )|0
        );
      const temp2 = (rightRotate(a,2) ^ rightRotate(a,13) ^ rightRotate(a,22))
        + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1+temp2)|0].concat(hash);
      hash[4] = (hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++){ hash[i] = (hash[i]+oldHash[i])|0; }
  }
  for(i=0;i<8;i++){
    for(j=3;j+1;j--){
      const b = (hash[i]>>(j*8))&255;
      result += ((b<16)?'0':'') + b.toString(16);
    }
  }
  return result;
}
function utf8ToBinaryString(str){ return unescape(encodeURIComponent(str)); }
function sha256Hex(str){ return sha256(utf8ToBinaryString(str)); }

const I18N_FR_FROM_EN = (function(){
  const m = {};
  Object.keys(I18N_EN).forEach(fr=>{ if(!(I18N_EN[fr] in m)) m[I18N_EN[fr]] = fr; });
  return m;
})();
let currentLang = (function(){
  try{ return localStorage.getItem('pilot360_lang') === 'en' ? 'en' : 'fr'; }catch(e){ return 'fr'; }
})();
// t('Texte français') → traduction dans la langue courante (utilisé pour les libellés
// passés à Chart.js, qui dessine sur un <canvas> et n'est donc pas atteint par le
// traducteur de DOM ci-dessous).
function t(fr){
  if(currentLang!=='en') return fr;
  return I18N_EN[fr] !== undefined ? I18N_EN[fr] : fr;
}
let __i18nApplying = false;
function translateTextNode(node, dict){
  const raw = node.nodeValue;
  if(!raw) return;
  const trimmed = raw.trim();
  if(!trimmed) return;
  if(Object.prototype.hasOwnProperty.call(dict, trimmed)){
    const translated = raw.replace(trimmed, dict[trimmed]);
    // N'écrit dans le DOM que si la valeur change réellement : une réécriture "no-op"
    // (ex. un mot identique en FR et en EN) déclenche quand même une mutation
    // characterData, ce qui relancerait l'observateur indéfiniment sur les paires
    // identiques FR=EN.
    if(translated !== raw) node.nodeValue = translated;
  }
}
function translateAttrs(el, dict){
  if(!el || el.nodeType!==1 || !el.getAttribute) return;
  ['placeholder','title'].forEach(attr=>{
    if(el.hasAttribute(attr)){
      const v = el.getAttribute(attr);
      if(v && Object.prototype.hasOwnProperty.call(dict, v)) el.setAttribute(attr, dict[v]);
    }
  });
}
// Traduit tout le texte visible (et les attributs placeholder/title) sous `root`,
// dans la langue courante — sans jamais toucher à la structure du DOM (donc sans
// casser les écouteurs d'événements déjà attachés). Fonctionne dans les deux sens
// (FR→EN et EN→FR) grâce au dictionnaire inversé ci-dessus.
function applyTranslations(root){
  root = root || document.body;
  if(!root) return;
  const dict = currentLang==='en' ? I18N_EN : I18N_FR_FROM_EN;
  if(root.nodeType===3){ translateTextNode(root, dict); return; }
  if(root.nodeType!==1) return;
  translateAttrs(root, dict);
  const tag = root.nodeName;
  if(tag==='SCRIPT'||tag==='STYLE') return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      const p = node.parentNode;
      if(!p || p.nodeName==='SCRIPT' || p.nodeName==='STYLE') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let n; const nodes=[];
  while((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>translateTextNode(node, dict));
  if(root.querySelectorAll){
    root.querySelectorAll('[placeholder],[title]').forEach(el=>translateAttrs(el, dict));
  }
}
// Traduit automatiquement tout nouveau contenu inséré dans la page (changement de vue,
// ouverture d'une modale, toast, etc.) sans qu'aucune fonction d'affichage n'ait besoin
// d'être adaptée individuellement.
const i18nObserver = new MutationObserver(mutations=>{
  if(__i18nApplying) return;
  __i18nApplying = true;
  try{
    mutations.forEach(m=>{
      if(m.type==='childList'){
        m.addedNodes.forEach(n=>applyTranslations(n));
      } else if(m.type==='characterData' && m.target){
        applyTranslations(m.target);
      }
    });
  } finally { __i18nApplying = false; }
});
function startI18nObserver(){
  i18nObserver.observe(document.body, { childList:true, subtree:true, characterData:true });
}
function setLang(lang){
  lang = (lang==='en') ? 'en' : 'fr';
  currentLang = lang;
  try{ localStorage.setItem('pilot360_lang', lang); }catch(e){}
  applyTranslations(document.body);
  if(currentUser) renderView();
  document.querySelectorAll('[data-lang-btn]').forEach(b=>{
    b.classList.toggle('active', b.dataset.langBtn===lang);
  });
}

// Convertit un montant saisi dans la devise courante vers l'unité de stockage (EUR).
function toEUR(n){ const conf = CURRENCIES[currentCurrency()] || CURRENCIES.EUR; return (Number(n)||0) / conf.rate; }
// Arrondit une valeur convertie pour pré-remplir un champ de saisie (sans décimales excessives).

function fmtMoney(n){

  const converted = (n||0) * conf.rate;
  return converted.toLocaleString(conf.locale,{style:'currency',currency:conf.code,maximumFractionDigits:0});

// Convertit un montant EUR (valeur brute stockée) en valeur numérique dans la devise courante — à utiliser pour les données de graphiques.
function moneyValue(n){ const conf = CURRENCIES[currentCurrency()] || CURRENCIES.EUR; return (n||0) * conf.rate; }
// Formatte un nombre déjà exprimé dans la devise courante (ex: axe de graphique), en version compacte.
function moneyTick(v){ const conf = CURRENCIES[currentCurrency()] || CURRENCIES.EUR; return new Intl.NumberFormat(conf.locale,{style:'currency',currency:conf.code,notation:'compact',maximumFractionDigits:1}).format(v); }
// Callback de tooltip Chart.js formatant la valeur (déjà convertie) dans la devise courante.

/* ---- Mini visual helpers (sparklines & data-bars, style Power BI) ---- */
function sparklineSVG(values, color){
  if(!values || !values.length) return '';
  const w=100,h=28,max=Math.max(...values,1),min=Math.min(...values,0);
  const range = (max-min)||1;
  const step = w/(values.length-1||1);
  const pts = values.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/range*h)).toFixed(1)}`).join(' ');
  const last = values[values.length-1];
  const lastY = (h-((last-min)/range*h)).toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${w}" cy="${lastY}" r="2.6" fill="${color}"/></svg>`;
}
function synthTrend(finalValue, points=6, volatility=0.12){
  // Génère une tendance synthétique déterministe menant à finalValue (pour illustrer les sparklines)
  const seedBase = Math.max(finalValue,1);
  const arr = [];
  for(let i=0;i<points;i++){
    const t = i/(points-1);
    const noise = Math.sin((seedBase+i*7))*volatility*seedBase;
    arr.push(Math.max(0, Math.round(seedBase*(0.55+0.45*t) + noise)));
  }
  arr[arr.length-1] = finalValue;
  return arr;
}
function dataBar(value, max, colorClass){
  const pct = max>0 ? Math.min(100, Math.round(value/max*100)) : 0;
  return `<div class="data-bar-wrap"><div class="data-bar-fill ${colorClass||''}" style="width:${pct}%"></div><div class="data-bar-label">${pct}%</div></div>`;
}

/* ---- Jauges "tubes cylindriques 3D sur axe gradué" (façon graphique Excel "Réalisation" : cylindre plein 0-100%, colonne colorée qui monte depuis la base, valeur affichée en bas) ---- */
const TUBE_PALETTE = ['#dc2626','#16a34a','#ea580c','#d946ef','#eab308','#0ea5e9','#7dd3c0','#2563eb','#7c3aed','#db2777'];
let __tubeSeq = 0;
function tubeGaugesSVG(items){
  if(!items || !items.length) return `<div class="empty-state" style="padding:30px">Aucune donnée</div>`;
  const axisW = 34, cellW = 96, rx = 24, ry = 7;
  const chartTop = 14;      // niveau 100%
  const chartBottom = 214;  // niveau 0% (base)
  const totalW = axisW + items.length * cellW + 14;
  const totalH = chartBottom + ry + 40;
  const dark = document.body.classList.contains('dark');
  const textColor = dark ? '#e5e9f2' : '#1e293b';
  const axisColor = dark ? '#64748b' : '#94a3b8';
  const gridColor = dark ? '#2a3752' : '#e8e2d0';
  const tubeEmpty = dark ? '#3a3626' : '#f2ecd6';       // corps "vide" du cylindre (façon crème, comme le modèle)
  const tubeEmptyEdge = dark ? '#544f38' : '#e0d6b0';
  const lidTop = dark ? '#8b93a3' : '#cfd4dc';
  const lidSide = dark ? '#5c6478' : '#9aa1ae';
  const cylPath = (top,bot)=>`M ${-rx} ${top} A ${rx} ${ry} 0 0 0 ${rx} ${top} L ${rx} ${bot} A ${rx} ${ry} 0 0 1 ${-rx} ${bot} Z`;
  // Axe gradué 0% à 100%
  const gridLines = [];
  for(let p=0;p<=100;p+=10){
    const y = chartBottom - (chartBottom-chartTop)*p/100;
    gridLines.push(`<line x1="${axisW}" y1="${y}" x2="${totalW-6}" y2="${y}" stroke="${gridColor}" stroke-width="1" stroke-dasharray="${p===0?'0':'2,3'}"/>`);
    gridLines.push(`<text x="${axisW-6}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="${axisColor}">${p}%</text>`);
  }
  const parts = items.map((it,i)=>{
    const cx = axisW + i*cellW + cellW/2;
    const pct = Math.max(0, Math.min(100, Math.round(it.pct)));
    const fillH = (chartBottom - chartTop) * pct/100;
    const fillY = chartBottom - fillH;
    const color = it.late ? '#dc2626' : (it.color || TUBE_PALETTE[i % TUBE_PALETTE.length]);
    const valueLabel = it.valueLabel != null ? esc(String(it.valueLabel)) : String(pct);
    __tubeSeq++;
    const clipId = 'tubeClip'+__tubeSeq, gradId = 'tubeGrad'+__tubeSeq;
    const outerPath = cylPath(chartTop, chartBottom);
    const labelCY = chartBottom - 18; // valeur affichée en bas du tube, au-dessus de la base
    return `
      <g transform="translate(${cx},0)">
        <defs>
          <clipPath id="${clipId}"><path d="${outerPath}"/></clipPath>
          <linearGradient id="${gradId}" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.6"/>
            <stop offset="45%" stop-color="${color}"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.85"/>
          </linearGradient>
        </defs>
        <path d="${outerPath}" fill="${tubeEmpty}" stroke="${tubeEmptyEdge}" stroke-width="1.2"/>
        <rect x="${-rx}" y="${fillY}" width="${rx*2}" height="${Math.max(fillH,0)}" fill="url(#${gradId})" clip-path="url(#${clipId})"/>
        ${pct>2?`<ellipse cx="0" cy="${fillY}" rx="${rx-1.5}" ry="${ry-1.5}" fill="${color}" clip-path="url(#${clipId})"/>`:''}
        <ellipse cx="0" cy="${chartBottom}" rx="${rx}" ry="${ry}" fill="none" stroke="${tubeEmptyEdge}" stroke-width="1.1"/>
        <path d="${outerPath}" fill="none" stroke="${tubeEmptyEdge}" stroke-width="1.2"/>
        <ellipse cx="0" cy="${chartTop}" rx="${rx}" ry="${ry}" fill="${lidTop}" stroke="${lidSide}" stroke-width="1"/>
        <rect x="-20" y="${labelCY-11}" width="40" height="21" rx="10.5" fill="${dark?'#0b1220':'#ffffff'}" stroke="${color}" stroke-width="1.4"/>
        <text x="0" y="${labelCY+4}" text-anchor="middle" font-size="11.5" font-weight="800" fill="${color}">${valueLabel}</text>
        <text x="0" y="${chartBottom+ry+24}" text-anchor="middle" font-size="12" font-weight="700" fill="${textColor}">${esc(it.label.length>13?it.label.slice(0,12)+'…':it.label)}</text>
      </g>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${totalW} ${totalH}" style="width:${Math.max(totalW,items.length*88+axisW)}px;height:100%;display:block;margin:0 auto" preserveAspectRatio="xMidYMid meet">
    ${gridLines.join('')}
    <line x1="${axisW}" y1="${chartBottom}" x2="${totalW-6}" y2="${chartBottom}" stroke="#ea580c" stroke-width="2"/>
    ${parts}
  </svg>`;
}

/* ---- Jauge radiale élégante (compteur demi-cercle + aiguille), façon tableau de bord premium ---- */
function arcGaugeSVG(pct, label, opts){
  opts = opts || {};
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  const cx = 110, cy = 112, r = 82, sw = 16;
  const dark = document.body.classList.contains('dark');
  const textColor = dark ? '#f1f5f9' : '#0f172a';
  const subColor = dark ? '#94a3b8' : '#64748b';
  const trackColor = dark ? '#1e293b' : '#eef1f6';
  // Angle 180° = point de départ (gauche), 0° = point d'arrivée (droite) ; on avance en degrés décroissants
  const pt = (p, radius) => {
    const rad = (180 - (180 * p / 100)) * Math.PI / 180;
    return [cx + radius * Math.cos(rad), cy - radius * Math.sin(rad)];
  };
  // Chemin échantillonné (évite toute ambiguïté de sweep/large-arc-flag) pour un arc toujours dessiné sur le dessus
  const arcPath = (p1, p2, radius, steps) => {
    steps = steps || Math.max(4, Math.round((p2 - p1) / 2));
    let d = '';
    for (let s = 0; s <= steps; s++) {
      const p = p1 + (p2 - p1) * s / steps;
      const [x, y] = pt(p, radius);
      d += (s === 0 ? 'M ' : 'L ') + x.toFixed(2) + ' ' + y.toFixed(2) + ' ';
    }
    return d;
  };
  const zoneColor = pct < 40 ? '#ef4444' : pct < 70 ? '#f59e0b' : '#22c55e';
  const bands = [
    { from: 0, to: 40, color: '#ef4444' },
    { from: 40, to: 70, color: '#f59e0b' },
    { from: 70, to: 100, color: '#22c55e' },
  ];
  const bandsSVG = bands.map(b => `<path d="${arcPath(b.from, b.to, r)}" fill="none" stroke="${b.color}" stroke-width="${sw}" stroke-linecap="butt" opacity="${dark ? 0.55 : 0.4}"/>`).join('');
  const progressSVG = pct > 0 ? `<path d="${arcPath(0, pct, r)}" fill="none" stroke="${zoneColor}" stroke-width="${sw}" stroke-linecap="round"/>` : '';
  const needleLen = r - 16;
  const [tipX, tipY] = pt(pct, needleLen);
  const valueLabel = opts.valueLabel != null ? opts.valueLabel : pct + '%';
  return `<svg viewBox="0 0 220 196" style="width:100%;max-width:230px;height:auto;display:block;margin:0 auto" preserveAspectRatio="xMidYMid meet">
    <path d="${arcPath(0, 100, r)}" fill="none" stroke="${trackColor}" stroke-width="${sw + 5}" stroke-linecap="round"/>
    ${bandsSVG}
    ${progressSVG}
    <line x1="${cx}" y1="${cy}" x2="${tipX.toFixed(2)}" y2="${tipY.toFixed(2)}" stroke="${textColor}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="7.5" fill="${textColor}"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="${zoneColor}"/>
    <text x="${cx}" y="${cy + 38}" text-anchor="middle" font-size="27" font-weight="800" fill="${zoneColor}">${esc(String(valueLabel))}</text>
    <text x="${cx}" y="${cy + 60}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${subColor}">${esc(label)}</text>
  </svg>`;
}

Object.entries(CRUD_DEFAULTS).forEach(([role, modules])=>{
  DEFAULT_ROLE_PERMISSIONS[role] = DEFAULT_ROLE_PERMISSIONS[role] || [];
  const conf = CRUD_RIGHTS_BY_ROLE[role] || {};
  modules.forEach(mKey=>{
    const rights = new Set(conf.all||[]);
    ['write','modify','delete'].forEach(r=>{ if((conf[r]||[]).includes(mKey)) rights.add(r); });
    rights.forEach(r=> DEFAULT_ROLE_PERMISSIONS[role].push(`${mKey}.${r}`));
  });
});

// Rôle effectif d'un utilisateur sur un chantier donné (rôle projet prioritaire sur le rôle global)
function effectiveRole(userId, chantierId){
  if(chantierId && DB.projectRoles && DB.projectRoles[chantierId] && DB.projectRoles[chantierId][userId]){
    return DB.projectRoles[chantierId][userId];
  }
  return userById(userId).role;
}

function can(action, chantierId){
  if(!currentUser) return false;
  const overrides = (DB.permissionOverrides && DB.permissionOverrides[currentUser.id]) || {};
  if(overrides[action] !== undefined) return overrides[action];
  const role = effectiveRole(currentUser.id, chantierId);
  const table = (DB.rolePermissions && DB.rolePermissions[role]) || DEFAULT_ROLE_PERMISSIONS[role] || [];
  return table.includes(action);
}

function ensureDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ return migrateDB(JSON.parse(raw)); }catch(e){} }
  const db = seed();
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  return db;
}
function nextDocCodeFor(db){
  const n = (db.documents||[]).length + 1;
  return 'DOC-' + String(n).padStart(4,'0');
}
function migrateDocForV2(d, db, codeNumero){
  // Ancien format (avant le module Validation & Contrôle Documentaire 360) : un document = un seul niveau plat,
  // sans historique de versions ni circuit d'approbation. On l'enveloppe dans le nouveau format SANS PERTE
  // DE DONNÉES : les champs existants (nom, version, statut, uploader, date) deviennent la première (et seule)
  // version connue, avec son statut d'origine préservé tel quel (statutManuel), faute de pouvoir reconstituer
  // un historique de circuit qui n'a jamais existé.
  const statutMap = { valide:'valide', en_attente:'en_validation', refuse:'rejete' };
  const version = {
    numero: d.version || 1, fichier: d.nom, date: d.date || todayISO(), dateSoumission: d.date || null,
    auteur: d.uploader || null, statutManuel: statutMap[d.statut] || d.statut || 'brouillon',
    reserves:false, commentaire:'', workflow:null,
  };
  // codeNumero est fourni par l'appelant (migrateDB) pour garantir un code unique par document
  // même lorsque plusieurs documents de l'ancien format sont migrés dans la même passe.
  d.code = d.code || ('DOC-' + String(codeNumero).padStart(4,'0'));
  d.dateCreation = d.dateCreation || d.date || todayISO();
  d.workflowId = d.workflowId !== undefined ? d.workflowId : null;
  d.versions = [version];
  d.activeVersionNumero = (version.statutManuel==='valide' || version.statutManuel==='valide_reserves') ? version.numero : null;
  syncDocMirror(d);
}
function migrateDB(db){
  const fresh = seed();
  Object.keys(fresh).forEach(k=>{ if(db[k]===undefined) db[k]=fresh[k]; });
  // Complète les sous-clés de settings apparues dans une mise à jour ultérieure
  if(!db.settings) db.settings = fresh.settings;
  Object.keys(fresh.settings).forEach(k=>{ if(db.settings[k]===undefined) db.settings[k]=fresh.settings[k]; });
  // Ajoute les éventuels nouveaux utilisateurs de démonstration (ex : nouveaux rôles) absents d'une sauvegarde ancienne
  (fresh.users||[]).forEach(u=>{ if(!(db.users||[]).some(x=>x.id===u.id)) db.users.push(u); });
  // Comble l'identifiant de connexion (mise à jour depuis une version où le login était l'e-mail) :
  // dérive un identifiant sans "@" à partir de la partie locale de l'e-mail, en garantissant son unicité.
  (db.users||[]).forEach(u=>{
    if(!u.username){
      let base = (u.email||u.nom||u.id||'user').split('@')[0].toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g,'')
        .replace(/[^a-z0-9._-]/g,'') || 'user';
      let candidate = base, n = 1;
      while((db.users||[]).some(x=>x!==u && (x.username||'').toLowerCase()===candidate)){
        candidate = base + (++n);
      }
      u.username = candidate;
    }
  });
  // Comble le mot de passe (mise à jour depuis une version sans authentification par mot de passe) :
  // les comptes existants reçoivent le mot de passe par défaut, à changer via Administration → Utilisateurs.
  (db.users||[]).forEach(u=>{ if(!u.passwordHash) u.passwordHash = hashPassword(DEFAULT_PASSWORD, u.id); });
  // Complète les champs de validation multi-acteurs sur les lots existants
  (db.lots||[]).forEach(l=>{
    if(l.validateursRequis===undefined) l.validateursRequis = ['bct','moe'];
    if(l.validateursExtra===undefined) l.validateursExtra = [];
    if(l.validations===undefined) l.validations = [];
  });
  // Ajoute les nouveaux droits CRUD (lecture/écriture/modification/suppression) par défaut sur une sauvegarde ancienne,
  // sans jamais toucher aux droits déjà connus qu'un administrateur aurait personnalisés.
  (CRUD_PERMISSION_KEYS||[]).forEach(p=>{
    Object.keys(DEFAULT_ROLE_PERMISSIONS).forEach(role=>{
      if(!db.rolePermissions) db.rolePermissions = {};
      if(!db.rolePermissions[role]) db.rolePermissions[role] = [];
      if((DEFAULT_ROLE_PERMISSIONS[role]||[]).includes(p.key) && !db.rolePermissions[role].includes(p.key)){
        db.rolePermissions[role].push(p.key);
      }
    });
  });
  // Module Validation & Contrôle Documentaire 360 : enveloppe les documents existants dans le nouveau format
  // (historique de versions + circuit d'approbation), sans aucune perte de données.
  if(!db.approvalWorkflows) db.approvalWorkflows = fresh.approvalWorkflows;
  if(!db.auditLogs) db.auditLogs = [];
  let nextCodeNumero = (db.documents||[]).filter(d=>d.code).length;
  (db.documents||[]).forEach(d=>{
    if(!Array.isArray(d.versions)){ nextCodeNumero++; migrateDocForV2(d, db, nextCodeNumero); }
    d.lotId = d.lotId!==undefined ? d.lotId : null;
  });
  return db;
}
// Retourne true si l'enregistrement a réussi. Cette maquette étant 100% locale (aucun serveur), l'espace de
// stockage du navigateur est limité (quelques Mo) : en cas de dépassement (ex. fichiers volumineux joints à des
// documents), on prévient l'utilisateur au lieu de laisser l'application planter ou perdre des données.
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    return true;
  }catch(e){
    toast("Stockage local plein — impossible d'enregistrer. Ce prototype stocke tout dans votre navigateur, sans serveur : essayez un fichier plus petit ou supprimez d'anciens documents.");
    return false;
  }
}
// Taille max par fichier joint à un document. Cette maquette stocke les fichiers en base64 directement dans le
// stockage local du navigateur (pas de serveur), dont la capacité totale est limitée à quelques Mo seulement —
// d'où cette limite, annoncée clairement à l'utilisateur plutôt que de le laisser perdre des données.
const MAX_DOC_FILE_SIZE = 4*1024*1024; // 4 Mo
// Ouvre le sélecteur de fichier natif du navigateur (tous formats acceptés) et lit le fichier choisi en base64.
// callback({name, type, size, dataUrl}) est appelé une fois la lecture terminée ; rien n'est appelé si annulé.
function pickAndReadFile(callback){
  const input = document.createElement('input');
  input.type = 'file';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', function(){
    const file = input.files && input.files[0];
    document.body.removeChild(input);
    if(!file) return;
    if(file.size > MAX_DOC_FILE_SIZE){
      toast(`Fichier trop volumineux (${Math.round(file.size/1024/1024*10)/10} Mo, maximum ${MAX_DOC_FILE_SIZE/1024/1024} Mo) — cette maquette stocke les fichiers dans votre navigateur, sans serveur, d'où cette limite.`);
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e){ callback({ name:file.name, type:file.type||'application/octet-stream', size:file.size, dataUrl:e.target.result }); };
    reader.onerror = function(){ toast('Erreur de lecture du fichier'); };
    reader.readAsDataURL(file);
  });
  input.click();
}
// Déconnexion forcée : utilisée à la fois par le bouton "Déconnexion" et par toute opération
// qui remplace intégralement les données (réinitialisation, restauration d'une sauvegarde),
// afin d'éviter qu'une session reste accrochée à un utilisateur qui n'existe plus (ou plus
// avec les mêmes droits/mot de passe) dans les nouvelles données.

// ---- Sauvegarde / Restauration ----
// Génère un fichier .json téléchargeable contenant l'intégralité des données de
// l'application (chantiers, lots, réserves, documents, utilisateurs, droits...).
function exportBackup(){
  const payload = { app:'PILOT360°', format:'pilot360-backup', version:1, exportedAt:new Date().toISOString(), data:DB };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url; a.download = `pilot360-sauvegarde-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Sauvegarde téléchargée');
}
// Lit un fichier de sauvegarde choisi par l'utilisateur, vérifie qu'il a une structure
// PILOT360° reconnaissable, puis remplace les données actuelles après confirmation.
// migrateDB() est réappliqué pour compléter d'éventuels champs manquants si la sauvegarde
// provient d'une version antérieure de l'application.
function handleRestoreFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ toast("Fichier invalide : ce n'est pas un JSON valide"); input.value=''; return; }
    const candidate = (parsed && typeof parsed==='object' && parsed.data && typeof parsed.data==='object') ? parsed.data : parsed;
    if(!candidate || !Array.isArray(candidate.users) || !Array.isArray(candidate.chantiers)){
      toast("Fichier invalide : structure de données PILOT360° non reconnue");
      input.value=''; return;
    }
    if(!confirm(t("Restaurer cette sauvegarde va remplacer TOUTES les données actuelles de l'application. Continuer ?"))){
      input.value=''; return;
    }
    try{
      DB = migrateDB(candidate);
      saveDB();
      logout();
      toast('Sauvegarde restaurée — reconnectez-vous');
    }catch(err){
      toast('Erreur lors de la restauration : ' + err.message);
    }
    input.value='';
  };
  reader.onerror = function(){ toast('Erreur de lecture du fichier'); input.value=''; };
  reader.readAsText(file);
}

function lotById(id){ return DB.lots.find(l=>l.id===id); }
function lotsForChantier(chantierId){ return DB.lots.filter(l=>l.chantierId===chantierId); }
function lotAggregates(chantierId){
  const lots = lotsForChantier(chantierId);
  if(!lots.length) { const c = chantierById(chantierId); return { budget:c.budget, depense:c.depense, avancement:c.avancement }; }
  const budget = lots.reduce((s,l)=>s+l.budget,0);
  const depense = lots.reduce((s,l)=>s+l.depense,0);
  const avancement = budget ? Math.round(lots.reduce((s,l)=>s+lotEffectiveAvancement(l)*l.budget,0)/budget) : 0;
  return { budget, depense, avancement };
}
function lotLabel(lotId){ if(!lotId) return ''; const l=lotById(lotId); return l ? l.nom : ''; }

/* ---- Validation multi-acteurs de l'avancement (BCT / MOE / autres) ---- */
// Liste des validations requises pour un lot : rôles obligatoires + validateurs "autres" désignés (par userId)
function lotRequiredValKeys(lot){
  const roleKeys = lot.validateursRequis || ['bct','moe'];
  const extraKeys = (lot.validateursExtra||[]).map(e=>e.userId);
  return [...roleKeys, ...extraKeys];
}
function lotValidationStatus(lot){
  const required = lotRequiredValKeys(lot);
  const submitted = lot.validations || [];
  const missing = required.filter(k=>!submitted.some(v=>v.valKey===k));
  const complete = required.length>0 && missing.length===0;
  const avgPartial = submitted.length ? Math.round(submitted.reduce((s,v)=>s+v.pourcentage,0)/submitted.length) : null;
  return { required, submitted, missing, complete, avgPartial };
}
function valKeyLabel(lot, key){
  if(ROLES[key]) return ROLES[key].label;
  const extra = (lot.validateursExtra||[]).find(e=>e.userId===key);
  if(extra) return extra.label;
  const u = DB.users.find(u=>u.id===key);
  return u ? u.nom : key;
}
// Pourcentage d'avancement effectivement retenu pour un lot : moyenne des validations si complètes,
// sinon la valeur déclarée (non officielle) en attendant la validation complète par le BCT/MOE/autres.
function lotEffectiveAvancement(lot){
  const st = lotValidationStatus(lot);
  return st.complete ? st.avgPartial : lot.avancement;
}

/* ---- Décompte client (suivi détaillé de l'effectivité des dépenses) ---- */
function depensesForChantier(chantierId){ return DB.depenses.filter(d=>d.chantierId===chantierId); }
function depensesForLot(lotId){ return DB.depenses.filter(d=>d.lotId===lotId); }
function decompteClient(chantierId){
  const percu = DB.factures.filter(f=>f.chantierId===chantierId && f.type==='client' && f.statut==='payee').reduce((s,f)=>s+f.montantHT,0);
  const utilise = depensesForChantier(chantierId).reduce((s,d)=>s+d.montant,0);
  const ecart = percu - utilise;
  return { percu, utilise, ecart };
}

  en_attente:        { label:'En cours de validation',   cls:'badge-orange'},
  refuse:            { label:'Rejeté',                   cls:'badge-red'   },
};
// Étapes de circuit de validation par défaut, calquées sur le circuit type Entreprise → Conducteur → MOE → BCT → MOA
const DEFAULT_WORKFLOW_ETAPES = [
  { role:'soustraitant', label:'Entreprise', delaiJours:5 },
  { role:'conducteur',   label:'Conducteur de travaux', delaiJours:3 },
  { role:'moe',          label:'Maîtrise d\'œuvre (MOE)', delaiJours:5 },
  { role:'bct',          label:'Bureau de contrôle (BCT)', delaiJours:5 },
  { role:'client',       label:'Maîtrise d\'ouvrage (MOA)', delaiJours:7 },
];
// Seuils de relance automatique (jours après soumission d'une étape sans décision)
const REMINDER_TIERS = [3,7,10];
const STATUT_RFI = { ouverte:{label:'Ouverte',cls:'badge-red'}, repondue:{label:'Répondue',cls:'badge-green'}, fermee:{label:'Fermée',cls:'badge-gray'} };
const STATUT_SUBMITTAL = { soumis:{label:'Soumis',cls:'badge-gray'}, en_revue:{label:'En revue',cls:'badge-orange'}, approuve:{label:'Approuvé',cls:'badge-green'}, revision_requise:{label:'Révision requise',cls:'badge-orange'}, rejete:{label:'Rejeté',cls:'badge-red'} };
const STATUT_AVENANT = { propose:{label:'Proposé',cls:'badge-orange'}, approuve:{label:'Approuvé',cls:'badge-green'}, refuse:{label:'Refusé',cls:'badge-red'} };
const STATUT_FACTURE = { brouillon:{label:'Brouillon',cls:'badge-gray'}, envoyee:{label:'Envoyée',cls:'badge-blue'}, payee:{label:'Payée',cls:'badge-green'}, en_retard:{label:'En retard',cls:'badge-red'} };

/* ============================================================
   MOTEUR DE VALIDATION & CONTRÔLE DOCUMENTAIRE 360
   Registre documentaire normalisé + historique de versions non-destructif +
   circuits d'approbation séquentiels configurables + piste d'audit + KPI.
   Inspiré des recommandations d'une analyse comparative face à Autodesk
   Construction Cloud et Procore. Cette maquette reste 100% cliente
   (sans backend), donc : pas de vrai stockage binaire de fichier, pas de
   vraies notifications poussées (relances calculées et affichées seulement),
   pas d'adresse IP dans la piste d'audit (donnée non disponible côté client).
   ============================================================ */

// Construit une instance de circuit de validation pour une version de document, à partir d'un gabarit d'étapes.
// decisions[i] vaut 'valide' | 'rejete' | null/undefined (étape pas encore décidée -> devient l'étape active si tout ce qui précède est validé).
function buildWorkflowInstance(etapesTemplate, dateDebut, decisions=[]){
  let blocked = false;
  let curDate = dateDebut;
  const etapes = etapesTemplate.map((e,i)=>{
    const decision = decisions[i] || null;
    let statut, dateDecision=null, dateDebutEtape=null;
    if(blocked){ statut='a_venir'; }
    else if(decision==='valide' || decision==='rejete'){
      dateDebutEtape = curDate;
      statut = decision;
      dateDecision = addDaysISO(curDate, 1);
      curDate = dateDecision;
      if(decision==='rejete') blocked = true;
    } else {
      dateDebutEtape = curDate;
      statut = 'en_attente';
      blocked = true;
    }
    return { ordre:i+1, role:e.role, label:e.label, delaiJours:e.delaiJours, statut,
      decideur:null, dateDecision, commentaire:'',
      dateDebut: dateDebutEtape, dateLimite: dateDebutEtape ? addDaysISO(dateDebutEtape, e.delaiJours) : null };
  });
  const statutGlobal = etapes.some(e=>e.statut==='rejete') ? 'rejete' : (etapes.every(e=>e.statut==='valide') ? 'valide' : 'en_cours');
  return { etapes, statutGlobal, dateDebut, dateFin: (statutGlobal!=='en_cours') ? etapes.filter(e=>e.dateDecision).slice(-1)[0]?.dateDecision : null };
}
// Statut normalisé (8 états) d'une version, dérivé de son circuit d'approbation en cours.
function computeDocVersionStatut(version){
  if(version.statutManuel) return version.statutManuel; // ex: archivage manuel, sans circuit
  if(!version.workflow) return 'brouillon';
  const wf = version.workflow;
  if(wf.statutGlobal === 'rejete') return 'rejete';
  if(wf.statutGlobal === 'valide') return version.reserves ? 'valide_reserves' : 'valide';
  const current = wf.etapes.find(e=>e.statut==='en_attente');
  if(current && current.ordre===1) return 'soumis';
  return 'en_validation';
}
// Version "active" d'un document = la dernière version approuvée (ou, à défaut, la plus récente).
function docActiveVersion(doc){
  if(doc.activeVersionNumero){ const v = doc.versions.find(v=>v.numero===doc.activeVersionNumero); if(v) return v; }
  return doc.versions[doc.versions.length-1];
}
function docLatestVersion(doc){ return doc.versions[doc.versions.length-1]; }
// Recalcule et synchronise les champs miroir de compatibilité (nom/version/statut/date/uploader) sur le document
// à partir de sa version active, afin que les vues existantes (tableaux, exports, dashboard) restent correctes.
function syncDocMirror(doc){
  const active = docActiveVersion(doc);
  const latest = docLatestVersion(doc);
  const ref = latest || active;
  doc.nom = ref.fichier; doc.version = ref.numero; doc.statut = computeDocVersionStatut(ref);
  doc.uploader = ref.auteur; doc.date = ref.date;
}
function docWorkflowTemplate(doc){
  if(doc.workflowId){ const wf = DB.approvalWorkflows.find(w=>w.id===doc.workflowId); if(wf) return wf.etapes; }
  return DEFAULT_WORKFLOW_ETAPES;
}
// Étape actuellement en attente de décision pour une version (null si aucune, ou si circuit clos).
function docCurrentStep(version){ return version.workflow ? version.workflow.etapes.find(e=>e.statut==='en_attente') : null; }
// L'utilisateur courant peut-il décider l'étape active de cette version ?
function canDecideDocStep(version, chantierId){
  const step = docCurrentStep(version);
  if(!step || !currentUser) return false;
  if(currentUser.role==='admin') return true;
  return effectiveRole(currentUser.id, chantierId) === step.role;
}
// Soumet une version en brouillon dans le circuit de validation (démarre la 1ère étape).
function submitDocVersion(documentId, versionNumero){
  const doc = DB.documents.find(d=>d.id===documentId); if(!doc) return;
  const version = doc.versions.find(v=>v.numero===versionNumero); if(!version) return;
  const etapesTemplate = docWorkflowTemplate(doc);
  version.dateSoumission = todayISO();
  version.workflow = buildWorkflowInstance(etapesTemplate, todayISO(), []);
  version.workflow.undoStack = [];
  version.statutManuel = null;
  syncDocMirror(doc); saveDB();
  logAudit('soumission', doc.id, versionNumero, '', '');
}
// Retire une version du circuit de validation et la remet en brouillon — possible tant qu'aucune étape
// n'a encore été décidée (erreur de soumission), pour ne jamais laisser une action irréversible par mégarde.
function undoSubmitDocVersion(documentId, versionNumero){
  const doc = DB.documents.find(d=>d.id===documentId); if(!doc) return;
  const version = doc.versions.find(v=>v.numero===versionNumero); if(!version || !version.workflow) return;
  if((version.workflow.undoStack||[]).length){ return; } // une décision a déjà été prise : utiliser l'annulation d'étape
  version.workflow = null; version.dateSoumission = null; version.statutManuel = null;
  syncDocMirror(doc); saveDB();
  logAudit('annulation', doc.id, versionNumero, '', 'Annulation de la soumission — retour au brouillon');
}
// Décide (valide/rejette) l'étape active de la version courante, avec application stricte du séquencement.
// Chaque décision empile un instantané complet permettant de l'annuler à tout moment via undoLastDocDecision().
function decideDocStep(documentId, versionNumero, decision, commentaire){
  const doc = DB.documents.find(d=>d.id===documentId); if(!doc) return;
  const version = doc.versions.find(v=>v.numero===versionNumero); if(!version || !version.workflow) return;
  const step = docCurrentStep(version); if(!step) return;
  if(!version.workflow.undoStack) version.workflow.undoStack = [];
  const idx = version.workflow.etapes.findIndex(e=>e.ordre===step.ordre);
  const next = version.workflow.etapes[idx+1];
  const snapshot = {
    stepOrdre: step.ordre,
    prevWorkflowStatutGlobal: version.workflow.statutGlobal,
    prevReserves: version.reserves,
    prevActiveVersionNumero: doc.activeVersionNumero,
    nextStepOrdre: next ? next.ordre : null,
    oldActiveVersionNumero: null,
    oldActiveStatutManuel: undefined,
  };
  step.statut = decision; step.dateDecision = todayISO(); step.decideur = currentUser ? currentUser.id : null; step.commentaire = commentaire||'';
  if(decision==='rejete'){
    version.workflow.statutGlobal = 'rejete';
  } else {
    if(commentaire && commentaire.trim()) version.reserves = true;
    if(next){ next.statut = 'en_attente'; next.dateDebut = todayISO(); next.dateLimite = addDaysISO(todayISO(), next.delaiJours); }
    else { version.workflow.statutGlobal = 'valide'; }
  }
  if(version.workflow.statutGlobal==='valide'){
    // La nouvelle version devient la version active ; l'ancienne version active passe au statut "Périmé".
    if(doc.activeVersionNumero && doc.activeVersionNumero !== version.numero){
      const oldActive = doc.versions.find(v=>v.numero===doc.activeVersionNumero);
      if(oldActive && (oldActive.statut==='valide' || oldActive.statut==='valide_reserves')){
        snapshot.oldActiveVersionNumero = oldActive.numero;
        snapshot.oldActiveStatutManuel = oldActive.statutManuel;
        oldActive.statutManuel = 'perime';
      }
    }
    doc.activeVersionNumero = version.numero;
  }
  version.workflow.undoStack.push(snapshot);
  syncDocMirror(doc); saveDB();
  logAudit(decision==='rejete'?'rejet':'validation', doc.id, versionNumero, commentaire||'', `Étape : ${step.label}`);
}
// Une décision de validation/rejet peut-elle être annulée sur cette version (clic par erreur, etc.) ?
function canUndoLastDocDecision(version, chantierId){
  if(!version.workflow || !(version.workflow.undoStack||[]).length || !currentUser) return false;
  if(currentUser.role==='admin') return true;
  const snap = version.workflow.undoStack[version.workflow.undoStack.length-1];
  const step = version.workflow.etapes.find(e=>e.ordre===snap.stepOrdre);
  return step && effectiveRole(currentUser.id, chantierId) === step.role;
}
// Annule la dernière décision prise sur cette version, en restaurant exactement l'état précédent
// (étape suivante, statut global du circuit, version active, statut de l'ancienne version supplantée).
function undoLastDocDecision(documentId, versionNumero){
  const doc = DB.documents.find(d=>d.id===documentId); if(!doc) return;
  const version = doc.versions.find(v=>v.numero===versionNumero); if(!version || !version.workflow || !(version.workflow.undoStack||[]).length) return;
  const snap = version.workflow.undoStack.pop();
  const step = version.workflow.etapes.find(e=>e.ordre===snap.stepOrdre);
  const oldDecision = step.statut;
  step.statut = 'en_attente'; step.dateDecision = null; step.decideur = null; step.commentaire = '';
  if(snap.nextStepOrdre){
    const next = version.workflow.etapes.find(e=>e.ordre===snap.nextStepOrdre);
    if(next){ next.statut = 'a_venir'; next.dateDecision = null; next.decideur = null; next.commentaire = ''; }
  }
  version.workflow.statutGlobal = snap.prevWorkflowStatutGlobal;
  version.reserves = snap.prevReserves;
  doc.activeVersionNumero = snap.prevActiveVersionNumero;
  if(snap.oldActiveVersionNumero){
    const oldActive = doc.versions.find(v=>v.numero===snap.oldActiveVersionNumero);
    if(oldActive) oldActive.statutManuel = snap.oldActiveStatutManuel || null;
  }
  syncDocMirror(doc); saveDB();
  logAudit('annulation', doc.id, versionNumero, '', `Annulation de la décision "${oldDecision==='valide'?'Validé':'Rejeté'}" — étape : ${step.label}`);
}
// Ajoute une nouvelle version (brouillon) à un document existant, sans jamais supprimer l'historique précédent.
function addDocVersion(doc, fichier, auteur){
  const numero = Math.max(...doc.versions.map(v=>v.numero)) + 1;
  const version = { numero, fichier, date:todayISO(), dateSoumission:null, auteur, statut:'brouillon', statutManuel:null, reserves:false, commentaire:'', workflow:null };
  doc.versions.push(version);
  syncDocMirror(doc);
  logAudit('nouvelle_version', doc.id, numero, 'Nouvelle version créée (brouillon)');
  return version;
}
// Piste d'audit : qui / quand / quoi / version / commentaire. Pas d'adresse IP (non disponible côté client statique).
function logAudit(action, documentId, versionNumero, commentaire, detail){
  if(!DB.auditLogs) DB.auditLogs = [];
  const doc = DB.documents.find(d=>d.id===documentId);
  DB.auditLogs.push({
    id:uid('audit'), date:new Date().toISOString(), userId: currentUser?currentUser.id:null,
    action, documentId, chantierId: doc?doc.chantierId:null, versionNumero, commentaire:commentaire||'', detail:detail||''
  });
}
// Info SLA/retard pour une étape en attente : jours écoulés depuis son démarrage, retard éventuel, palier de relance atteint.
function stepSLAInfo(step){
  if(!step || step.statut!=='en_attente' || !step.dateDebut) return null;
  const joursEcoules = daysBetweenISO(step.dateDebut, todayISO());
  const enRetard = step.dateLimite ? (todayISO() > step.dateLimite) : false;
  const palier = REMINDER_TIERS.filter(t=>joursEcoules>=t).pop() || null;
  return { joursEcoules, enRetard, palier };
}
// Temps moyen de validation (en jours, soumission -> décision finale) sur un ensemble de documents.
function avgValidationTimeDays(docs){
  const durees = [];
  docs.forEach(d=>d.versions.forEach(v=>{
    if(v.workflow && v.workflow.statutGlobal!=='en_cours' && v.dateSoumission){
      const fin = v.workflow.dateFin || v.workflow.etapes.filter(e=>e.dateDecision).slice(-1)[0]?.dateDecision;
      if(fin) durees.push(daysBetweenISO(v.dateSoumission, fin));
    }
  }));
  if(!durees.length) return null;
  return Math.round((durees.reduce((s,x)=>s+x,0)/durees.length)*10)/10;
}
// Calcule les indicateurs KPI de validation documentaire pour un ensemble de documents (globalement ou par lot).
function docsKPI(docs){
  let enAttente=0, rejetes=0, retards=0, finalises=0, approuves=0;
  docs.forEach(d=>{
    const v = docLatestVersion(d);
    const st = computeDocVersionStatut(v);
    if(st==='soumis' || st==='en_validation') enAttente++;
    if(st==='rejete') rejetes++;
    if(st==='valide' || st==='valide_reserves' || st==='rejete') finalises++;
    if(st==='valide' || st==='valide_reserves') approuves++;
    const step = docCurrentStep(v);
    const sla = stepSLAInfo(step);
    if(sla && sla.enRetard) retards++;
  });
  const tempsMoyen = avgValidationTimeDays(docs);
  const tauxApprobation = finalises ? Math.round((approuves/finalises)*100) : null;
  return { total:docs.length, enAttente, rejetes, retards, tempsMoyen, tauxApprobation };
}
function nextDocCode(){
  const n = (DB.documents||[]).length + 1;
  return 'DOC-' + String(n).padStart(4,'0');
}

}

/* ---------------- LOGIN ---------------- */
function renderLogin(){
  const username = document.getElementById('login-username');
  const pwd = document.getElementById('login-password');
  if(username) username.value = '';
  if(pwd) pwd.value = '';
  hideLoginError();
}
function showLoginError(msg){
  const box = document.getElementById('login-error');
  if(!box) return;
  box.textContent = msg;
  box.style.display = 'block';
}
function hideLoginError(){
  const box = document.getElementById('login-error');
  if(box) box.style.display = 'none';
}
function attemptLogin(){
  const usernameInput = document.getElementById('login-username');
  const pwdInput = document.getElementById('login-password');
  const username = usernameInput.value.trim().toLowerCase();
  const password = pwdInput.value;
  hideLoginError();
  if(!username || !password){ showLoginError('Veuillez renseigner votre identifiant et votre mot de passe.'); return; }
  const user = (DB.users||[]).find(u=>(u.username||'').toLowerCase()===username);
  if(!user || !user.passwordHash || user.passwordHash !== hashPassword(password, user.id)){
    showLoginError('Identifiant ou mot de passe incorrect.');
    pwdInput.value = '';
    pwdInput.focus();
    return;
  }
  currentUser = user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('show');
  document.getElementById('user-name').textContent = currentUser.nom;
  document.getElementById('user-role').textContent = ROLES[currentUser.role].label;
  document.getElementById('user-avatar').textContent = initials(currentUser.nom);
  navigate('dashboard');
}
document.getElementById('btn-login').addEventListener('click', attemptLogin);
document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
document.getElementById('login-username').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('login-password').focus(); });

/* ---------------- RECHERCHE GLOBALE ---------------- */
window.__searchResults = [];
function normalizeSearch(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function searchIndex(query){
  if(!currentUser) return [];
  const q = normalizeSearch(query.trim());
  if(q.length < 2) return [];
  const match = (...vals) => vals.some(v => v!=null && normalizeSearch(v).includes(q));
  const results = [];
  const chantiers = visibleChantiers();
  const ids = chantiers.map(c=>c.id);

  chantiers.forEach(c=>{
    if(match(c.nom, c.adresse)) results.push({ group:'Chantiers', ico:'🏗️', title:c.nom, sub:c.adresse, action:()=>navigate('chantiers', c.id) });
  });
  DB.lots.filter(l=>ids.includes(l.chantierId)).forEach(l=>{
    if(match(l.nom, l.corpsEtat, l.entreprise)) results.push({ group:'Lots', ico:'🧱', title:l.nom, sub:chantierById(l.chantierId).nom+' · '+l.entreprise, action:()=>navigate('chantiers', l.chantierId, 'lots') });
  });
  DB.reserves.filter(r=>ids.includes(r.chantierId)).forEach(r=>{
    if(match(r.titre, r.desc, r.localisation)) results.push({ group:'Réserves', ico:'📌', title:r.titre, sub:chantierById(r.chantierId).nom+(r.localisation?' · '+r.localisation:''), action:()=>navigate('chantiers', r.chantierId, 'reserves') });
  });
  DB.documents.filter(d=>ids.includes(d.chantierId)).forEach(d=>{
    if(match(d.nom, d.dossier)) results.push({ group:'Documents', ico:'📁', title:d.nom, sub:chantierById(d.chantierId).nom+' · '+d.dossier, action:()=>navigate('chantiers', d.chantierId, 'documents') });
  });
  DB.rfis.filter(r=>ids.includes(r.chantierId)).forEach(r=>{
    if(match(r.titre, r.numero, r.question)) results.push({ group:'RFI', ico:'❓', title:r.numero+' — '+r.titre, sub:chantierById(r.chantierId).nom, action:()=>{ ui.suiviTab='rfi'; navigate('suivi'); viewRfiDetail(r.id); } });
  });
  DB.submittals.filter(s=>ids.includes(s.chantierId)).forEach(s=>{
    if(match(s.titre, s.numero, s.entreprise)) results.push({ group:'Soumissions techniques', ico:'📐', title:s.numero+' — '+s.titre, sub:chantierById(s.chantierId).nom, action:()=>{ ui.suiviTab='submittals'; navigate('suivi'); viewSubmittalDetail(s.id); } });
  });
  DB.avenants.filter(a=>ids.includes(a.chantierId)).forEach(a=>{
    if(match(a.titre, a.numero)) results.push({ group:'Avenants', ico:'📄', title:a.numero+' — '+a.titre, sub:chantierById(a.chantierId).nom, action:()=>{ ui.suiviTab='avenants'; navigate('suivi'); } });
  });
  DB.rapports.filter(r=>ids.includes(r.chantierId)).forEach(r=>{
    if(match(r.titre)) results.push({ group:'Comptes-rendus', ico:'📝', title:r.titre, sub:chantierById(r.chantierId).nom, action:()=>{ navigate('rapports'); viewRapportDetail(r.id); } });
  });
  if(can('facture.create') || can('facture.validate') || currentUser.role==='admin'){
    DB.factures.filter(f=>ids.includes(f.chantierId)).forEach(f=>{
      if(match(f.numero, f.tiers, f.description)) results.push({ group:'Factures', ico:'💶', title:f.numero+' — '+f.tiers, sub:chantierById(f.chantierId).nom, action:()=>{ ui.comptaTab = f.type==='client'?'clients':'fournisseurs'; ui.comptaFilter=f.chantierId; navigate('compta'); } });
    });
  }
  DB.bonsCommande.filter(bc=>ids.includes(bc.chantierId) && canSeeBC(bc)).forEach(bc=>{
    if(match(bc.numero, bc.fournisseur)) results.push({ group:'Bons de commande', ico:'📦', title:bc.numero+' — '+bc.fournisseur, sub:chantierById(bc.chantierId).nom, action:()=>{ navigate('bc'); viewBCDetail(bc.id); } });
  });
  if(currentUser.role==='admin'){
    DB.users.forEach(u=>{
      if(match(u.nom, u.email)) results.push({ group:'Utilisateurs', ico:'👤', title:u.nom, sub:u.email, action:()=>{ ui.adminTab='users'; navigate('admin'); } });
    });
  }
  return results.slice(0, 30);
}
function renderSearchResults(query){
  const box = document.getElementById('search-results');
  if(!box) return;
  const q = query.trim();
  if(q.length < 2){ box.classList.remove('show'); box.innerHTML=''; return; }
  const results = searchIndex(q);
  window.__searchResults = results;
  if(!results.length){
    box.innerHTML = `<div class="sr-empty">Aucun résultat pour « ${esc(q)} »</div>`;
  } else {
    let lastGroup = null;
    box.innerHTML = results.map((r,i)=>{
      const groupHtml = r.group!==lastGroup ? `<div class="sr-group">${esc(r.group)}</div>` : '';
      lastGroup = r.group;
      return `${groupHtml}<div class="sr-item" onclick="runSearchResult(${i})"><span class="sr-ico">${r.ico}</span><div class="sr-txt"><b>${esc(r.title)}</b><span>${esc(r.sub||'')}</span></div></div>`;
    }).join('');
  }
  box.classList.add('show');
}
function runSearchResult(i){
  const r = window.__searchResults[i];
  if(!r) return;
  r.action();
  const input = document.getElementById('global-search');
  if(input) input.value = '';
  const box = document.getElementById('search-results');
  if(box){ box.classList.remove('show'); box.innerHTML=''; }
}
document.getElementById('global-search').addEventListener('input', e=>{
  renderSearchResults(e.target.value);
});
document.getElementById('global-search').addEventListener('focus', e=>{
  if(e.target.value.trim().length>=2) renderSearchResults(e.target.value);
});
document.getElementById('global-search').addEventListener('keydown', e=>{
  if(e.key==='Escape'){ e.target.value=''; renderSearchResults(''); e.target.blur(); }
});
document.addEventListener('click', e=>{
  const box = document.getElementById('search-results');
  const wrap = document.querySelector('.topbar .search');
  if(box && wrap && !wrap.contains(e.target)) box.classList.remove('show');
});

/* ================= ANALYSE (croisement de données / BI) ================= */
function chantierAnalytics(chantiers){
  const now = new Date();
  return chantiers.map(c=>{
    const agg = lotAggregates(c.id);
    const budgetPct = agg.budget>0 ? Math.round(agg.depense/agg.budget*100) : 0;
    const budgetEfficacite = Math.max(0, Math.min(100, 100 - (budgetPct - agg.avancement)));
    const debut = new Date(c.dateDebut), fin = new Date(c.dateFin);
    const dureeTotale = Math.max(1, (fin-debut)/86400000);
    const ecoule = Math.max(0, Math.min(dureeTotale, (now-debut)/86400000));
    const tempsEcoulePct = Math.round(ecoule/dureeTotale*100);
    const respectDelai = Math.max(0, Math.min(100, 100 - (tempsEcoulePct - agg.avancement)));
    const reserves = DB.reserves.filter(r=>r.chantierId===c.id);
    const qualite = reserves.length ? Math.round(reserves.filter(r=>r.statut==='levee').length/reserves.length*100) : 100;
    const facture = DB.factures.filter(f=>f.chantierId===c.id&&f.type==='client').reduce((s,f)=>s+f.montantHT,0);
    const encaisse = DB.factures.filter(f=>f.chantierId===c.id&&f.type==='client'&&f.statut==='payee').reduce((s,f)=>s+f.montantHT,0);
    const encaissement = facture>0 ? Math.round(encaisse/facture*100) : 100;
    const d = decompteClient(c.id);
    const utilisationDecompte = d.percu>0 ? Math.round(d.utilise/d.percu*100) : 0;
    const score = Math.round((budgetEfficacite + respectDelai + qualite + encaissement)/4);
    return { c, agg, budgetPct, budgetEfficacite, tempsEcoulePct, respectDelai, qualite, encaissement, utilisationDecompte, score };
  });
}
function dashAnalyseTab(chantiers){
  const rows = chantierAnalytics(chantiers).sort((a,b)=>a.score-b.score);
  const n = rows.length || 1;
  const avg = (key)=> Math.round(rows.reduce((s,r)=>s+r[key],0)/n);
  const scoreGlobal = avg('score');
  const alertes = rows.filter(r=>r.score<60);
  return `
    <div class="grid cols-4">
      <div class="card" style="text-align:center;padding-top:16px">${arcGaugeSVG(scoreGlobal,'Efficacité globale')}</div>
      <div class="card" style="text-align:center;padding-top:16px">${arcGaugeSVG(avg('budgetEfficacite'),'Maîtrise budgétaire')}</div>

      <div class="card" style="text-align:center;padding-top:16px">${arcGaugeSVG(avg('encaissement'),"Taux d'encaissement")}</div>
    </div>
    <div class="grid cols-2" style="margin-top:16px;align-items:start">
      <div class="card"><h3>Score d'efficacité par chantier</h3><p class="muted" style="font-size:11.5px;margin-top:2px">Moyenne de 4 indicateurs : maîtrise budgétaire, respect des délais, qualité (résolution des réserves), encaissement client.</p><div style="height:280px;margin-top:10px;overflow-x:auto" id="gauge-analyse-score"></div></div>
      <div class="card"><h3>Comparatif multi-critères (radar)</h3><div style="height:300px;margin-top:10px"><canvas id="chart-analyse-radar"></canvas></div></div>
    </div>
    <div class="grid cols-2" style="margin-top:16px;align-items:start">
      <div class="card"><h3>Tendance de l'avancement moyen</h3><div style="height:230px;margin-top:10px"><canvas id="chart-analyse-trend"></canvas></div></div>
      <div class="card">
        <h3>Alertes de gestion</h3>

function recentActivity(chantiers){
  const ids = chantiers.map(c=>c.id);
  const items = [];
  DB.reserves.filter(r=>ids.includes(r.chantierId)).forEach(r=>items.push({date:r.dateCreation,title:'Réserve : '+r.titre,desc:chantierById(r.chantierId).nom}));
  DB.rapports.filter(r=>ids.includes(r.chantierId)).forEach(r=>items.push({date:r.date,title:r.titre,desc:chantierById(r.chantierId).nom}));
  DB.documents.filter(d=>ids.includes(d.chantierId)).forEach(d=>items.push({date:d.date,title:'Document : '+d.nom,desc:chantierById(d.chantierId).nom}));
  return items.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
}
